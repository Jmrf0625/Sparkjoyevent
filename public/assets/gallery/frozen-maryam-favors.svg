<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="frozenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#frozenBg)"/>

  <!-- Snowflakes -->
  <path d="M 120 100 L 120 140 M 100 120 L 140 120 M 106 106 L 134 134 M 106 134 L 134 106" stroke="#38BDF8" stroke-width="3"/>
  <path d="M 680 110 L 680 150 M 660 130 L 700 130 M 666 116 L 694 144 M 666 144 L 694 116" stroke="#EC4899" stroke-width="3"/>

  <!-- Frozen Favor Bags (Icy Blue & Soft Pink) -->
  <g transform="translate(130, 150)">
    <path d="M 30 50 Q 60 10 90 50" stroke="#0284C7" stroke-width="5" fill="none"/>
    <rect x="10" y="50" width="100" height="210" rx="16" fill="#38BDF8" stroke="#0284C7" stroke-width="4"/>
    <circle cx="60" cy="140" r="30" fill="#FFFFFF"/>
    <!-- Snowflake icon -->
    <path d="M 60 120 L 60 160 M 40 140 L 80 140" stroke="#0284C7" stroke-width="4"/>
    <text x="60" y="195" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MARYAM 4</text>
  </g>

  <!-- Center Bag (Pink & Ice Blue Elsa Castle Bag) -->
  <g transform="translate(310, 110)">
    <path d="M 40 60 Q 80 10 120 60" stroke="#DB2777" stroke-width="6" fill="none"/>
    <rect x="10" y="60" width="150" height="260" rx="20" fill="#F472B6" stroke="#DB2777" stroke-width="4"/>
    <!-- White Circle Elsa & Anna Badge -->
    <circle cx="85" cy="160" r="45" fill="#FFFFFF" stroke="#38BDF8" stroke-width="3"/>
    <!-- Ice Castle silhouette -->
    <polygon points="85,125 70,150 75,150 75,185 95,185 95,150 100,150" fill="#38BDF8"/>
    <text x="85" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">FROZEN MARYAM TURNS 4</text>
  </g>

  <!-- Right Bag -->
  <g transform="translate(550, 150)">
    <path d="M 30 50 Q 60 10 90 50" stroke="#0284C7" stroke-width="5" fill="none"/>
    <rect x="10" y="50" width="100" height="210" rx="16" fill="#38BDF8" stroke="#0284C7" stroke-width="4"/>
    <circle cx="60" cy="140" r="30" fill="#FFFFFF"/>
    <path d="M 60 120 L 60 160 M 40 140 L 80 140" stroke="#0284C7" stroke-width="4"/>
  </g>

  <!-- Frozen Accessories: Coloring Book, Slime & Bubbles -->
  <g transform="translate(200, 390)">
    <rect x="0" y="0" width="80" height="100" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="3"/>
    <text x="40" y="30" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0284C7" text-anchor="middle">FROZEN</text>
    <text x="40" y="45" font-family="sans-serif" font-size="8" fill="#DB2777" text-anchor="middle">COLORING</text>
  </g>

  <!-- Title Badge -->
  <rect x="150" y="510" width="500" height="50" rx="25" fill="#0369A1"/>
  <text x="400" y="542" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">FROZEN MARYAM TURNS 4 FAVORS</text>
</svg>
