<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="dinoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6FFFA" />
      <stop offset="100%" stop-color="#B2F5EA" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#dinoGrad)"/>

  <!-- Hanging Rope -->
  <line x1="400" y1="0" x2="400" y2="150" stroke="#111B3A" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Dinosaur Piñata Shape -->
  <g transform="translate(250, 150)">
    <!-- Spikes along back -->
    <path d="M 80 120 L 60 70 L 110 100 L 110 50 L 150 90 L 170 40 L 200 80 Z" fill="#FFD166" stroke="#111B3A" stroke-width="3"/>
    <!-- Dino Body -->
    <path d="M 80 140 Q 40 180 80 260 Q 180 300 240 220 Q 280 180 240 120 Q 180 80 120 120 Z" fill="#06D6A0" stroke="#111B3A" stroke-width="4"/>
    <!-- Dino Head & Mouth -->
    <path d="M 220 130 Q 280 90 270 160 Q 220 180 210 160 Z" fill="#06D6A0" stroke="#111B3A" stroke-width="4"/>
    <circle cx="245" cy="120" r="6" fill="#111B3A"/>
    <path d="M 260 145 L 245 155 L 260 160 Z" fill="#FFFFFF"/>
    <!-- Fringe Tassels -->
    <rect x="100" y="260" width="12" height="70" fill="#FF9F1C"/>
    <rect x="125" y="265" width="12" height="75" fill="#E92D72"/>
    <rect x="150" y="260" width="12" height="70" fill="#FFD166"/>
    <rect x="175" y="255" width="12" height="65" fill="#8338EC"/>
  </g>

  <!-- Title Badge -->
  <rect x="180" y="490" width="440" height="50" rx="25" fill="#111B3A"/>
  <text x="400" y="523" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BESPOKE DINOSAUR PIÑATA</text>
</svg>
