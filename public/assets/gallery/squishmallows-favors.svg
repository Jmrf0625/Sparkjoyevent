<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="squishBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#E9D5FF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#squishBg)"/>

  <!-- Pastel Confetti & Hearts -->
  <path d="M 100 90 A 10 10 0 0 1 120 90 A 10 10 0 0 1 140 90 Q 140 110 120 130 Q 100 110 100 90 Z" fill="#F472B6"/>
  <path d="M 680 100 A 10 10 0 0 1 700 100 A 10 10 0 0 1 720 100 Q 720 120 700 140 Q 680 120 680 100 Z" fill="#38BDF8"/>
  <circle cx="710" cy="460" r="14" fill="#FBBF24"/>

  <!-- Squishmallows Gift Bags (Pastel Pink & Purple) -->
  <g transform="translate(130, 150)">
    <path d="M 30 50 Q 60 10 90 50" stroke="#7E22CE" stroke-width="5" fill="none"/>
    <rect x="10" y="50" width="100" height="210" rx="16" fill="#EC4899" stroke="#7E22CE" stroke-width="4"/>
    <!-- Cute Squishmallow Face -->
    <ellipse cx="60" cy="140" rx="35" ry="30" fill="#FFFFFF"/>
    <circle cx="48" cy="135" r="4" fill="#111827"/>
    <circle cx="72" cy="135" r="4" fill="#111827"/>
    <ellipse cx="40" cy="142" rx="5" ry="3" fill="#F472B6"/>
    <ellipse cx="80" cy="142" rx="5" ry="3" fill="#F472B6"/>
  </g>

  <!-- Center Bag (Pastel Purple Squishmallows) -->
  <g transform="translate(310, 110)">
    <path d="M 40 60 Q 80 10 120 60" stroke="#7E22CE" stroke-width="6" fill="none"/>
    <rect x="10" y="60" width="150" height="260" rx="20" fill="#A855F7" stroke="#7E22CE" stroke-width="4"/>
    <!-- Big Squishmallow Character Body -->
    <ellipse cx="85" cy="160" rx="50" ry="45" fill="#FFFFFF"/>
    <circle cx="68" cy="155" r="6" fill="#111827"/>
    <circle cx="102" cy="155" r="6" fill="#111827"/>
    <path d="M 80 165 Q 85 172 90 165" stroke="#111827" stroke-width="3" fill="none"/>
    <ellipse cx="58" cy="165" rx="7" ry="4" fill="#F472B6"/>
    <ellipse cx="112" cy="165" rx="7" ry="4" fill="#F472B6"/>
    <text x="85" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">SQUISHMALLOWS</text>
  </g>

  <!-- Right Bag (Pastel Rainbow) -->
  <g transform="translate(550, 150)">
    <path d="M 30 50 Q 60 10 90 50" stroke="#7E22CE" stroke-width="5" fill="none"/>
    <rect x="10" y="50" width="100" height="210" rx="16" fill="#38BDF8" stroke="#7E22CE" stroke-width="4"/>
    <ellipse cx="60" cy="140" rx="35" ry="30" fill="#FFFFFF"/>
    <circle cx="48" cy="135" r="4" fill="#111827"/>
    <circle cx="72" cy="135" r="4" fill="#111827"/>
  </g>

  <!-- Cute Accessories: Squishmallow Pens, Slime Jars & Plushies -->
  <g transform="translate(200, 390)">
    <rect x="0" y="0" width="80" height="50" rx="10" fill="#F472B6" stroke="#7E22CE" stroke-width="3"/>
    <text x="40" y="30" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CUDDLY SLIME</text>
  </g>

  <!-- Title Badge -->
  <rect x="150" y="510" width="500" height="50" rx="25" fill="#7E22CE"/>
  <text x="400" y="542" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SQUISHMALLOWS PARTY FAVORS</text>
</svg>
