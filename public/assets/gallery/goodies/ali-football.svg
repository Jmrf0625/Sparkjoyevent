<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFoot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="tissueBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="tissueGold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgFoot)"/>

  <!-- Shimmer Backdrop Grid -->
  <g stroke="#93C5FD" stroke-width="1" opacity="0.5">
    <rect x="50" y="30" width="120" height="80" rx="4" fill="#FFFFFF"/>
    <rect x="200" y="30" width="120" height="80" rx="4" fill="#FFFFFF"/>
    <rect x="350" y="30" width="120" height="80" rx="4" fill="#FFFFFF"/>
    <rect x="500" y="30" width="120" height="80" rx="4" fill="#FFFFFF"/>
    <rect x="650" y="30" width="120" height="80" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- 4 WHITE GIFT BAGS WITH BLUE & GOLD TISSUE & PINK RIBBONS -->
  <!-- Bag 1 -->
  <g transform="translate(60, 100)">
    <path d="M 20 -20 L 40 20 L 60 -30 L 80 20 L 100 -20 L 110 40 Z" fill="url(#tissueBlue)"/>
    <path d="M 30 -10 L 50 30 L 70 -10 L 90 30 Z" fill="url(#tissueGold2)"/>
    <path d="M 35 40 Q 60 10 85 40" stroke="#1E3A8A" stroke-width="4" fill="none"/>
    <rect x="15" y="40" width="90" height="170" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <!-- Pink Bow -->
    <path d="M 60 45 L 40 30 Q 30 50 60 45 Z" fill="#EC4899"/>
    <path d="M 60 45 L 80 30 Q 90 50 60 45 Z" fill="#EC4899"/>
    <!-- Sticker -->
    <rect x="22" y="90" width="76" height="70" fill="#F0F9FF" rx="6" stroke="#0284C7" stroke-width="2"/>
    <text x="60" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#1E3A8A" text-anchor="middle">Ali's 3rd</text>
    <text x="60" y="132" font-family="sans-serif" font-size="9" fill="#2563EB" text-anchor="middle">Birthday</text>
    <circle cx="60" cy="148" r="8" fill="#1E3A8A"/>
  </g>

  <!-- Bag 2 (Center Left) -->
  <g transform="translate(220, 80)">
    <path d="M 25 -30 L 55 30 L 85 -40 L 115 30 L 145 -30 Z" fill="url(#tissueBlue)"/>
    <path d="M 40 -15 L 70 40 L 100 -20 L 130 40 Z" fill="url(#tissueGold2)"/>
    <path d="M 45 50 Q 80 10 115 50" stroke="#1E3A8A" stroke-width="5" fill="none"/>
    <rect x="15" y="50" width="130" height="200" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
    <path d="M 80 55 L 50 35 Q 40 60 80 55 Z" fill="#EC4899"/>
    <path d="M 80 55 L 110 35 Q 120 60 80 55 Z" fill="#EC4899"/>
    <rect x="25" y="110" width="110" height="90" fill="#F0F9FF" rx="8" stroke="#0284C7" stroke-width="2"/>
    <text x="80" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#1E3A8A" text-anchor="middle">Ali's 3rd</text>
    <text x="80" y="162" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">Birthday</text>
  </g>

  <!-- Bag 3 (Center Right) -->
  <g transform="translate(430, 80)">
    <path d="M 25 -30 L 55 30 L 85 -40 L 115 30 L 145 -30 Z" fill="url(#tissueBlue)"/>
    <path d="M 40 -15 L 70 40 L 100 -20 L 130 40 Z" fill="url(#tissueGold2)"/>
    <path d="M 45 50 Q 80 10 115 50" stroke="#1E3A8A" stroke-width="5" fill="none"/>
    <rect x="15" y="50" width="130" height="200" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
    <path d="M 80 55 L 50 35 Q 40 60 80 55 Z" fill="#38BDF8"/>
    <path d="M 80 55 L 110 35 Q 120 60 80 55 Z" fill="#38BDF8"/>
    <rect x="25" y="110" width="110" height="90" fill="#F0F9FF" rx="8" stroke="#0284C7" stroke-width="2"/>
    <text x="80" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#1E3A8A" text-anchor="middle">Ali's 3rd</text>
    <text x="80" y="162" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">Birthday</text>
  </g>

  <!-- Bag 4 -->
  <g transform="translate(630, 100)">
    <path d="M 20 -20 L 40 20 L 60 -30 L 80 20 Z" fill="url(#tissueBlue)"/>
    <path d="M 30 -10 L 50 30 L 70 -10 Z" fill="url(#tissueGold2)"/>
    <path d="M 35 40 Q 60 10 85 40" stroke="#1E3A8A" stroke-width="4" fill="none"/>
    <rect x="15" y="40" width="90" height="170" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <rect x="22" y="90" width="76" height="70" fill="#F0F9FF" rx="6" stroke="#0284C7" stroke-width="2"/>
    <text x="60" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#1E3A8A" text-anchor="middle">Ali's 3rd</text>
  </g>

  <!-- FRONT TABLE DISPLAY ITEMS -->
  <!-- Bubbles Pack in Center -->
  <g transform="translate(350, 290)">
    <rect x="0" y="0" width="100" height="50" rx="8" fill="#38BDF8" stroke="#1E3A8A" stroke-width="2"/>
    <text x="50" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BUBBLES</text>
  </g>

  <!-- Coloring Books -->
  <g transform="translate(240, 360)">
    <rect x="0" y="0" width="140" height="150" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
    <rect x="10" y="15" width="120" height="30" fill="#60A5FA" rx="4"/>
    <text x="70" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">COLORING BOOK</text>
    <circle cx="70" cy="90" r="30" fill="#FDE047"/>
  </g>
  <g transform="translate(420, 360)">
    <rect x="0" y="0" width="140" height="150" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
    <rect x="10" y="15" width="120" height="30" fill="#60A5FA" rx="4"/>
    <text x="70" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">COLORING BOOK</text>
    <circle cx="70" cy="90" r="30" fill="#FDE047"/>
  </g>

  <!-- Slime Tubs & Cones -->
  <circle cx="210" cy="380" r="30" fill="#BFDBFE" stroke="#2563EB" stroke-width="2"/>
  <circle cx="590" cy="380" r="30" fill="#E9D5FF" stroke="#7E22CE" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="140" y="525" width="520" height="50" rx="25" fill="#1E3A8A"/>
  <text x="400" y="557" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ALI'S 3RD FOOTBALL GOODIE BAGS</text>
</svg>
