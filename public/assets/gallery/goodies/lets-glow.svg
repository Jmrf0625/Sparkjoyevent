    <text x="80" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#F472B6" text-anchor="middle">MY PARTY GLOW</text>
    <text x="80" y="188" font-family="sans-serif" font-size="10" fill="#EAB308" text-anchor="middle">Love, Israa</text>
  </g>

  <g transform="translate(560, 110)">
