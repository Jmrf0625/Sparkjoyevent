<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSquish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="purpleGlitter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgSquish)"/>

  <!-- PINK, BLUE & PURPLE SQUISHMALLOWS GIFT BAGS -->
  <!-- Left Bag (Pink) -->
  <g transform="translate(100, 110)">
    <path d="M 20 -20 L 40 20 L 60 -30 L 80 20 L 100 -20 Z" fill="url(#purpleGlitter)"/>
    <path d="M 35 40 Q 60 10 85 40" stroke="#FFFFFF" stroke-width="4" fill="none"/>
    <rect x="15" y="40" width="110" height="180" rx="12" fill="#F472B6" stroke="#DB2777" stroke-width="3"/>
    <!-- Rainbow Sticker -->
    <rect x="25" y="100" width="90" height="70" fill="#FFFFFF" rx="8" stroke="#F472B6" stroke-width="2"/>
    <text x="70" y="125" font-family="sans-serif" font-size="8" font-weight="bold" fill="#7E22CE" text-anchor="middle">SQUISHMALLOWS</text>
    <path d="M 40 145 Q 70 130 100 145" stroke="#F472B6" stroke-width="4" fill="none"/>
  </g>

  <!-- Center Bag (Blue) -->
  <g transform="translate(320, 80)">
    <path d="M 25 -30 L 55 30 L 85 -40 L 115 30 L 145 -30 Z" fill="url(#purpleGlitter)"/>
    <path d="M 45 50 Q 80 10 115 50" stroke="#FFFFFF" stroke-width="5" fill="none"/>
    <rect x="15" y="50" width="130" height="210" rx="14" fill="#38BDF8" stroke="#0284C7" stroke-width="4"/>
    <rect x="25" y="120" width="110" height="80" fill="#FFFFFF" rx="10" stroke="#38BDF8" stroke-width="2"/>
    <!-- Rainbow -->
    <path d="M 40 170 Q 80 140 120 170" stroke="#F472B6" stroke-width="6" fill="none"/>
    <path d="M 45 170 Q 80 145 115 170" stroke="#FBBF24" stroke-width="6" fill="none"/>
    <text x="80" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#7E22CE" text-anchor="middle">SQUISHMALLOWS</text>
  </g>

  <!-- Right Bag (Purple) -->
  <g transform="translate(560, 110)">
    <path d="M 20 -20 L 40 20 L 60 -30 L 80 20 Z" fill="url(#purpleGlitter)"/>
    <path d="M 35 40 Q 60 10 85 40" stroke="#FFFFFF" stroke-width="4" fill="none"/>
    <rect x="15" y="40" width="110" height="180" rx="12" fill="#C084FC" stroke="#7E22CE" stroke-width="3"/>
    <rect x="25" y="100" width="90" height="70" fill="#FFFFFF" rx="8" stroke="#C084FC" stroke-width="2"/>
    <text x="70" y="125" font-family="sans-serif" font-size="8" font-weight="bold" fill="#7E22CE" text-anchor="middle">SQUISHMALLOWS</text>
  </g>

  <!-- FRONT TABLE SQUISHMALLOWS PACKAGES -->
  <!-- Coloring Books -->
  <g transform="translate(220, 340)">
    <rect x="0" y="0" width="160" height="170" rx="10" fill="#FFFFFF" stroke="#C084FC" stroke-width="3"/>
    <rect x="10" y="15" width="140" height="30" fill="#F472B6" rx="6"/>
    <text x="80" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">COLORING BOOK</text>
    <path d="M 30 110 Q 80 70 130 110" stroke="#F472B6" stroke-width="8" fill="none"/>
    <path d="M 35 110 Q 80 75 125 110" stroke="#FBBF24" stroke-width="8" fill="none"/>
    <text x="80" y="150" font-family="sans-serif" font-size="9" font-weight="bold" fill="#7E22CE" text-anchor="middle">CUTE. CUDDLY. COLORFUL.</text>
  </g>
  <g transform="translate(420, 340)">
    <rect x="0" y="0" width="160" height="170" rx="10" fill="#FFFFFF" stroke="#C084FC" stroke-width="3"/>
    <rect x="10" y="15" width="140" height="30" fill="#F472B6" rx="6"/>
    <text x="80" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">COLORING BOOK</text>
    <path d="M 30 110 Q 80 70 130 110" stroke="#F472B6" stroke-width="8" fill="none"/>
    <path d="M 35 110 Q 80 75 125 110" stroke="#FBBF24" stroke-width="8" fill="none"/>
    <text x="80" y="150" font-family="sans-serif" font-size="9" font-weight="bold" fill="#7E22CE" text-anchor="middle">CUTE. CUDDLY. COLORFUL.</text>
  </g>

  <!-- Slime Jars with Squishmallows Lids -->
  <circle cx="140" cy="380" r="35" fill="#BFDBFE" stroke="#38BDF8" stroke-width="3"/>
  <circle cx="660" cy="380" r="35" fill="#FBCFE8" stroke="#F472B6" stroke-width="3"/>

  <!-- Title Badge -->
  <rect x="140" y="525" width="520" height="50" rx="25" fill="#7E22CE"/>
  <text x="400" y="557" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SQUISHMALLOWS CUDDLY GOODIE BAGS</text>
</svg>
