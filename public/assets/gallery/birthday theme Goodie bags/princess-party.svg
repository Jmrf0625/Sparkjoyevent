<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#F8C7DC" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#FF9F1C" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Decorative Arch & Curtains -->
  <path d="M 100 600 L 100 200 Q 400 50 700 200 L 700 600 Z" fill="#FFFFFF" opacity="0.6"/>
  <path d="M 150 600 L 150 240 Q 400 100 650 240 L 650 600 Z" fill="#FFF5F8"/>

  <!-- Balloons Cluster Arch -->
  <circle cx="200" cy="180" r="45" fill="#E92D72" opacity="0.9"/>
  <circle cx="260" cy="140" r="50" fill="#F8C7DC"/>
  <circle cx="330" cy="110" r="55" fill="#FFD166"/>
  <circle cx="410" cy="100" r="60" fill="#E92D72"/>
  <circle cx="490" cy="110" r="55" fill="#8338EC"/>
  <circle cx="560" cy="140" r="50" fill="#F8C7DC"/>
  <circle cx="620" cy="180" r="45" fill="#06D6A0"/>

  <!-- Princess Castle Silhouette & Table -->
  <rect x="250" y="380" width="300" height="180" rx="16" fill="#FFFFFF" stroke="#E92D72" stroke-width="4"/>
  <path d="M 360 380 L 400 300 L 440 380 Z" fill="url(#goldGrad)"/>
  <rect x="385" y="270" width="30" height="30" fill="#E92D72"/>
  <path d="M 385 270 L 400 240 L 415 270 Z" fill="#FFD166"/>

  <!-- Birthday Cake -->
  <rect x="365" y="330" width="70" height="50" rx="6" fill="#F8C7DC" stroke="#111B3A" stroke-width="3"/>
  <rect x="380" y="295" width="40" height="35" rx="4" fill="#FFFFFF" stroke="#111B3A" stroke-width="3"/>
  <line x1="400" y1="280" x2="400" y2="295" stroke="#E92D72" stroke-width="4"/>
  <circle cx="400" cy="275" r="5" fill="#FFD166"/>

  <!-- Sparkles -->
  <path d="M 120 100 L 125 115 L 140 120 L 125 125 L 120 140 L 115 125 L 100 120 L 115 115 Z" fill="#FFD166"/>
  <path d="M 680 120 L 685 135 L 700 140 L 685 145 L 680 160 L 675 145 L 660 140 L 675 135 Z" fill="#E92D72"/>

  <!-- Banner Text Badge -->
  <rect x="200" y="490" width="400" height="50" rx="25" fill="#111B3A"/>
  <text x="400" y="523" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">PRINCESS BIRTHDAY SETUP</text>
</svg>
