  <rect x="310" y="270" width="180" height="25" rx="8" fill="#8338EC" stroke="#111B3A" stroke-width="3"/>
  <text x="400" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#111B3A" text-anchor="middle">SPARK SLIME</text>

  <!-- Title Badge -->
  <rect x="180" y="490" width="440" height="50" rx="25" fill="#111B3A"/>
  <text x="400" y="523" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SLIME & CLAY CRAFTING STATION</text>
