      <stop offset="0%" stop-color="#EBFBEE" />
      <stop offset="100%" stop-color="#D3F9D8" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#slimeGrad)"/>

  <!-- Slime Bowls and Splash -->
  <path d="M 200 300 Q 150 200 250 180 Q 380 150 420 240 Q 500 180 580 230 Q 650 300 580 380 Q 480 440 380 390 Q 250 420 200 300 Z" fill="#06D6A0" opacity="0.85" stroke="#111B3A" stroke-width="4"/>

