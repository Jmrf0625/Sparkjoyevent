<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1150" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Magical Night Sky with Gold Bokeh & Lanterns -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D114C"/>
      <stop offset="40%" stop-color="#4A1E73"/>
      <stop offset="70%" stop-color="#6B2C8C"/>
      <stop offset="100%" stop-color="#8338EC"/>
    </linearGradient>

    <!-- Table Mat Surface -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Cookie Gingerbread Texture -->
    <linearGradient id="cookieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C"/>
      <stop offset="50%" stop-color="#D4932B"/>
      <stop offset="100%" stop-color="#B8781B"/>
    </linearGradient>

    <!-- Glow Filter for Lanterns & Moon -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Wallpaper -->
  <rect width="800" height="750" fill="url(#skyGrad)"/>

  <!-- Golden Bokeh Lights & Stars -->
  <g opacity="0.6">
    <circle cx="100" cy="120" r="40" fill="#FDE047" opacity="0.25" filter="url(#goldGlow)"/>
    <circle cx="250" cy="80" r="25" fill="#FDE047" opacity="0.3"/>
    <circle cx="650" cy="140" r="50" fill="#FDE047" opacity="0.2" filter="url(#goldGlow)"/>
    <circle cx="720" cy="280" r="30" fill="#FDE047" opacity="0.25"/>
    <circle cx="150" cy="350" r="35" fill="#FDE047" opacity="0.15"/>
    
    <!-- Stars -->
    <path d="M 120 200 L 123 208 L 131 208 L 125 213 L 127 221 L 120 216 L 113 221 L 115 213 L 109 208 L 117 208 Z" fill="#FDE047" opacity="0.7"/>
    <path d="M 680 220 L 682 226 L 688 226 L 683 230 L 685 236 L 680 232 L 675 236 L 677 230 L 672 226 L 678 226 Z" fill="#FDE047" opacity="0.8"/>
  </g>

  <!-- Golden Crescent Moon -->
  <g transform="translate(560, 130)" filter="url(#goldGlow)">
    <path d="M 0,-45 A 45,45 0 1,0 45,0 A 35,35 0 1,1 0,-45 Z" fill="#FEF08A"/>
  </g>

  <!-- Hanging Ramadan Lanterns & Garlands -->
  <g fill="none" stroke="#FDE047" stroke-width="1.5" opacity="0.85">
    <!-- Hanging Strings -->
    <line x1="80" y1="0" x2="80" y2="120"/>
    <line x1="140" y1="0" x2="140" y2="160"/>
    <line x1="680" y1="0" x2="680" y2="140"/>

    <!-- Garland Swag Wire -->
    <path d="M 0,60 Q 200,120 400,60 Q 600,120 800,60"/>
  </g>

  <!-- Lantern 1 (Left) -->
  <g transform="translate(80, 120)" filter="url(#goldGlow)">
    <polygon points="0,0 -12,12 12,12" fill="#F59E0B"/>
    <rect x="-14" y="12" width="28" height="35" rx="3" fill="#FEF08A"/>
    <polygon points="-14,47 14,47 0,60" fill="#F59E0B"/>
    <circle cx="0" cy="30" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Lantern 2 (Left Lower) -->
  <g transform="translate(140, 160)" filter="url(#goldGlow)">
    <polygon points="0,0 -15,15 15,15" fill="#D97706"/>
    <rect x="-18" y="15" width="36" height="45" rx="4" fill="#FEF08A"/>
    <polygon points="-18,60 18,60 0,75" fill="#D97706"/>
    <circle cx="0" cy="37" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Table Surface Background -->
  <rect y="580" width="800" height="570" fill="url(#tableGrad)"/>
  <!-- Table Sparkles -->
  <ellipse cx="400" cy="620" rx="380" ry="40" fill="#93C5FD" opacity="0.2"/>

  <!-- White Lace Doily Mat -->
  <ellipse cx="400" cy="650" rx="220" ry="70" fill="#FFFFFF" opacity="0.95" filter="url(#softDrop)"/>
  <ellipse cx="400" cy="650" rx="210" ry="65" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- ================= COOKIE MOSQUE HOUSE ================= -->
  <g transform="translate(400, 380)" filter="url(#softDrop)">
    
    <!-- Main Cookie Building Body -->
    <path d="M -160,200 L -160,50 L 0,-60 L 160,50 L 160,200 Z" fill="url(#cookieGrad)" stroke="#A16207" stroke-width="2"/>
    
    <!-- Side Wall Depth Shadow -->
    <path d="M -160,200 L -160,50 L -210,80 L -210,230 Z" fill="#B8781B" stroke="#854D0E" stroke-width="1.5"/>

    <!-- Left Minaret Tower -->
    <rect x="-150" y="-80" width="35" height="180" fill="url(#cookieGrad)" stroke="#A16207" stroke-width="1.5"/>
    <polygon points="-150,-80 -132.5,-130 -115,-80" fill="url(#cookieGrad)" stroke="#A16207" stroke-width="1.5"/>
    <!-- Minaret Star & Moon Topper -->
    <path d="M -132.5,-145 A 8,8 0 1,0 -124.5,-137 A 6,6 0 1,1 -132.5,-145 Z" fill="#F59E0B"/>

    <!-- Center Roof Crescent Dome Topper -->
    <path d="M 0,-100 A 35,35 0 1,0 35,-65 A 28,28 0 1,1 0,-100 Z" fill="url(#cookieGrad)" stroke="#A16207" stroke-width="2"/>

    <!-- White Royal Icing Roof Trims -->
    <path d="M -165,50 L 0,-65 L 165,50" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Red Candy Ribbon on Roof Edge -->
    <path d="M -165,50 L 0,-65 L 165,50" stroke="#EF4444" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Colorful Candy Pearls on Roof Edge -->
    <g fill="#F59E0B">
      <circle cx="-140" cy="30" r="5" fill="#EF4444"/>
      <circle cx="-120" cy="15" r="5" fill="#10B981"/>
      <circle cx="-100" cy="0" r="5" fill="#3B82F6"/>
      <circle cx="-80" cy="-15" r="5" fill="#F59E0B"/>
      <circle cx="-60" cy="-30" r="5" fill="#EC4899"/>
      <circle cx="-40" cy="-45" r="5" fill="#10B981"/>
      <circle cx="-20" cy="-55" r="5" fill="#EF4444"/>
      <circle cx="0" cy="-62" r="6" fill="#F59E0B"/>
      <circle cx="20" cy="-55" r="5" fill="#3B82F6"/>
      <circle cx="40" cy="-45" r="5" fill="#10B981"/>
      <circle cx="60" cy="-30" r="5" fill="#EF4444"/>
      <circle cx="80" cy="-15" r="5" fill="#EC4899"/>
      <circle cx="100" cy="0" r="5" fill="#F59E0B"/>
      <circle cx="120" cy="15" r="5" fill="#10B981"/>
      <circle cx="140" cy="30" r="5" fill="#3B82F6"/>
    </g>

    <!-- Arched Mosque Doorway -->
    <path d="M -35,200 L -35,140 A 35,35 0 0,1 35,140 L 35,200 Z" fill="#451A03"/>
    <!-- White Icing & Sprinkles Trim on Door -->
    <path d="M -35,200 L -35,140 A 35,35 0 0,1 35,140 L 35,200" stroke="#FFFFFF" stroke-width="8" fill="none"/>
    <path d="M -35,200 L -35,140 A 35,35 0 0,1 35,140 L 35,200" stroke="#10B981" stroke-width="3" stroke-dasharray="4 4" fill="none"/>

    <!-- Side Arched Window -->
    <path d="M -120,130 L -120,100 A 15,15 0 0,1 -90,100 L -90,130 Z" fill="#451A03" stroke="#FFFFFF" stroke-width="4"/>
  </g>

  <!-- ================= CLEAR POTS WITH CANDY & TOPPINGS ================= -->
  <!-- Pot 1: White Chocolate Chips (Far Left) -->
  <g transform="translate(150, 710)" filter="url(#softDrop)">
    <ellipse cx="0" cy="30" rx="60" ry="20" fill="#E2E8F0" opacity="0.6"/>
    <rect x="-55" y="-10" width="110" height="40" rx="8" fill="#FFFFFF" opacity="0.75" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Lid Rim -->
    <ellipse cx="0" cy="-10" rx="58" ry="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <!-- White Chips -->
    <circle cx="-30" cy="10" r="5" fill="#FFFBEB"/><circle cx="-10" cy="15" r="5" fill="#FEF3C7"/><circle cx="15" cy="12" r="5" fill="#FFFBEB"/><circle cx="30" cy="8" r="5" fill="#FEF3C7"/>
  </g>

  <!-- Pot 2: Colorful M&M Candies (Center Left) -->
  <g transform="translate(320, 750)" filter="url(#softDrop)">
    <ellipse cx="0" cy="30" rx="65" ry="22" fill="#E2E8F0" opacity="0.6"/>
    <rect x="-60" y="-10" width="120" height="42" rx="8" fill="#FFFFFF" opacity="0.75" stroke="#CBD5E1" stroke-width="2"/>
    <ellipse cx="0" cy="-10" rx="62" ry="14" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <!-- M&M Candies -->
    <circle cx="-35" cy="12" r="7" fill="#EF4444"/>
    <circle cx="-18" cy="18" r="7" fill="#F59E0B"/>
    <circle cx="0" cy="10" r="7" fill="#3B82F6"/>
    <circle cx="18" cy="18" r="7" fill="#10B981"/>
    <circle cx="35" cy="12" r="7" fill="#EC4899"/>
  </g>

  <!-- Pot 3: Pink & White Marshmallows (Center Right) -->
  <g transform="translate(520, 750)" filter="url(#softDrop)">
    <ellipse cx="0" cy="30" rx="65" ry="22" fill="#E2E8F0" opacity="0.6"/>
    <rect x="-60" y="-10" width="120" height="42" rx="8" fill="#FFFFFF" opacity="0.75" stroke="#CBD5E1" stroke-width="2"/>
    <ellipse cx="0" cy="-10" rx="62" ry="14" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <!-- Marshmallows -->
    <rect x="-35" y="5" width="18" height="12" rx="6" fill="#FCE7F3"/>
    <rect x="-10" y="12" width="18" height="12" rx="6" fill="#FFFFFF"/>
    <rect x="15" y="5" width="18" height="12" rx="6" fill="#FCE7F3"/>
  </g>

  <!-- Pot 4: Chocolate Sprinkles (Far Right) -->
  <g transform="translate(680, 710)" filter="url(#softDrop)">
    <ellipse cx="0" cy="30" rx="55" ry="18" fill="#E2E8F0" opacity="0.6"/>
    <rect x="-50" y="-10" width="100" height="38" rx="8" fill="#FFFFFF" opacity="0.75" stroke="#CBD5E1" stroke-width="2"/>
    <ellipse cx="0" cy="-10" rx="52" ry="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <!-- Chocolate Chips -->
    <circle cx="-25" cy="10" r="5" fill="#451A03"/><circle cx="-5" cy="12" r="5" fill="#78350F"/><circle cx="15" cy="8" r="5" fill="#451A03"/>
  </g>

  <!-- ================= COLORFUL ICING PIPING BAGS IN FOREGROUND ================= -->
  <!-- Blue Piping Bag -->
  <g transform="translate(480, 830) rotate(-15)" filter="url(#softDrop)">
    <path d="M 0,0 L 140,-40 L 160,-20 Z" fill="#2563EB"/>
    <path d="M 0,0 L 140,-40 L 130,-50 L -10,-10 Z" fill="#3B82F6"/>
    <!-- Crinkled Twisted Top -->
    <ellipse cx="145" cy="-35" rx="12" ry="18" fill="#1D4ED8"/>
  </g>

  <!-- Green Piping Bag -->
  <g transform="translate(680, 810) rotate(10)" filter="url(#softDrop)">
    <path d="M 0,0 L 130,-30 L 140,-10 Z" fill="#059669"/>
    <path d="M 0,0 L 130,-30 L 120,-40 L -10,-10 Z" fill="#10B981"/>
  </g>

  <!-- Red Piping Bag in Foreground -->
  <g transform="translate(520, 870) rotate(-5)" filter="url(#softDrop)">
    <path d="M 0,0 L 220,-60 L 235,-30 L 20,20 Z" fill="#DC2626"/>
    <path d="M 0,0 L 220,-60 L 205,-80 L -15,-20 Z" fill="#EF4444"/>
    <!-- Twisted Tie End -->
    <ellipse cx="220" cy="-50" rx="15" ry="25" fill="#991B1B"/>
  </g>

  <!-- White Piping Bag -->
  <g transform="translate(660, 890) rotate(-18)" filter="url(#softDrop)">
    <path d="M 0,0 L 200,-50 L 210,-25 Z" fill="#E2E8F0"/>
    <path d="M 0,0 L 200,-50 L 190,-70 Z" fill="#FFFFFF"/>
  </g>

  <!-- ================= HAND PIPING ICING ONTO HOUSE (RIGHT) ================= -->
  <g transform="translate(560, 260)" filter="url(#softDrop)">
    <!-- Red Piping Bag held in Hand -->
    <path d="M -80,180 L 100,-20 L 120,10 L -60,200 Z" fill="#DC2626"/>
    <path d="M -80,180 L 100,-20 L 90,-40 L -90,160 Z" fill="#EF4444"/>
    
    <!-- Red Icing Stream coming from tip -->
    <path d="M -80,180 Q -110,210 -150,225" stroke="#EF4444" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- Decorator Hand holding Bag -->
    <path d="M 80,20 C 60,0 80,-30 110,-20 C 130,-10 140,20 120,40 C 100,50 80,30 80,20 Z" fill="#FCA5A5"/>
    <path d="M 90,10 Q 110,25 125,10" stroke="#F87171" stroke-width="3" fill="none"/>
  </g>

</svg>
