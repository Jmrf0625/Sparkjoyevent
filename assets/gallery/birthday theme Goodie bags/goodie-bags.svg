<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F8" />
      <stop offset="100%" stop-color="#FFE5EE" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad2)"/>

  <!-- Confetti Background -->
  <circle cx="100" cy="100" r="12" fill="#FFD166"/>
  <circle cx="700" cy="120" r="16" fill="#8338EC"/>
  <circle cx="150" cy="500" r="14" fill="#06D6A0"/>
  <circle cx="680" cy="480" r="10" fill="#FF9F1C"/>
  <rect x="200" y="80" width="16" height="16" fill="#E92D72" transform="rotate(25 200 80)"/>
  <rect x="600" y="160" width="20" height="20" fill="#118AB2" transform="rotate(40 600 160)"/>

  <!-- Row of Gift & Goodie Bags -->
  <!-- Bag 1: Pink & Dots -->
  <g transform="translate(140, 180)">
    <path d="M 30 50 Q 60 10 90 50" stroke="#111B3A" stroke-width="5" fill="none"/>
    <rect x="10" y="50" width="100" height="220" rx="16" fill="#E92D72" stroke="#111B3A" stroke-width="4"/>
    <circle cx="40" cy="100" r="6" fill="#FFFFFF"/>
    <circle cx="80" cy="110" r="6" fill="#FFFFFF"/>
    <circle cx="30" cy="160" r="6" fill="#FFFFFF"/>
    <circle cx="70" cy="170" r="6" fill="#FFFFFF"/>
    <path d="M 30 200 L 90 200" stroke="#FFD166" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Bag 2: Gold & Sparkles (Center Big Bag) -->
  <g transform="translate(320, 140)">
    <path d="M 40 60 Q 80 10 120 60" stroke="#111B3A" stroke-width="6" fill="none"/>
    <rect x="10" y="60" width="140" height="270" rx="20" fill="#FFD166" stroke="#111B3A" stroke-width="4"/>
    <!-- Ribbon Bow -->
    <path d="M 80 160 L 40 130 Q 30 160 80 160 Z" fill="#E92D72"/>
    <path d="M 80 160 L 120 130 Q 130 160 80 160 Z" fill="#E92D72"/>
    <circle cx="80" cy="160" r="10" fill="#111B3A"/>
    <!-- Sparkle on bag -->
    <path d="M 80 220 L 84 232 L 96 236 L 84 240 L 80 252 L 76 240 L 64 236 L 76 232 Z" fill="#E92D72"/>
  </g>

  <!-- Bag 3: Purple & Stripes -->
  <g transform="translate(520, 190)">
    <path d="M 30 50 Q 60 10 90 50" stroke="#111B3A" stroke-width="5" fill="none"/>
    <rect x="10" y="50" width="100" height="210" rx="16" fill="#8338EC" stroke="#111B3A" stroke-width="4"/>
    <line x1="20" y1="90" x2="100" y2="90" stroke="#06D6A0" stroke-width="8"/>
    <line x1="20" y1="130" x2="100" y2="130" stroke="#FFD166" stroke-width="8"/>
    <line x1="20" y1="170" x2="100" y2="170" stroke="#F8C7DC" stroke-width="8"/>
  </g>

  <!-- Title Badge -->
  <rect x="180" y="490" width="440" height="50" rx="25" fill="#111B3A"/>
  <text x="400" y="523" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">HANDCRAFTED GOODIE BAGS</text>
</svg>
