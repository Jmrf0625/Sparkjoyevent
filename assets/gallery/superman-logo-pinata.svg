<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="supBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FEE2E2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#supBg)"/>

  <!-- Rope -->
  <line x1="400" y1="0" x2="400" y2="100" stroke="#78350F" stroke-width="8"/>

  <!-- Superman Emblem Diamond Piñata Shape -->
  <!-- Outer Yellow Diamond Border -->
  <polygon points="400,100 620,180 540,420 400,480 260,420 180,180" fill="#EAB308" stroke="#1E3A8A" stroke-width="8"/>

  <!-- Inner Red Diamond Base -->
  <polygon points="400,120 600,195 525,405 400,460 275,405 200,195" fill="#DC2626" stroke="#991B1B" stroke-width="6"/>

  <!-- Iconic 'S' Symbol in Yellow -->
  <path d="M 470 180 L 330 180 Q 280 220 330 260 L 450 300 Q 500 350 430 400 L 320 400 Q 280 370 290 350 L 340 350 Q 330 370 370 370 L 430 370 Q 450 340 410 320 L 320 280 Q 250 220 320 180 Z" fill="#EAB308" stroke="#1E3A8A" stroke-width="4"/>

  <!-- Fringed crepe paper layers -->
  <path d="M 230 210 L 570 210" stroke="#B91C1C" stroke-width="6" stroke-dasharray="10 5"/>
  <path d="M 270 300 L 530 300" stroke="#B91C1C" stroke-width="6" stroke-dasharray="10 5"/>
  <path d="M 310 390 L 490 390" stroke="#B91C1C" stroke-width="6" stroke-dasharray="10 5"/>

  <!-- Title Badge -->
  <rect x="150" y="520" width="500" height="50" rx="25" fill="#1E3A8A"/>
  <text x="400" y="552" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SUPERMAN EMBLEM EMBOSSED PIÑATA</text>
</svg>
