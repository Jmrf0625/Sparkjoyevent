    <rect x="25" y="100" width="90" height="70" fill="#1E1B4B" rx="8" stroke="#A855F7" stroke-width="2"/>
    <text x="70" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" fill="#F472B6" text-anchor="middle">HAPPY BIRTHDAY</text>
    <text x="70" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">Amna 5</text>
  </g>

