  <circle cx="660" cy="380" r="35" fill="#FEF08A" stroke="#EAB308" stroke-width="3"/>

  <!-- Title Badge -->
  <rect x="140" y="525" width="520" height="50" rx="25" fill="#581C87"/>
  <text x="400" y="557" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">K-POP DEMON HUNTERS AMNA 5 BAGS</text>
