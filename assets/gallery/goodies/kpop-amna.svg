    <rect x="10" y="15" width="140" height="35" fill="#7E22CE" rx="6"/>
    <text x="80" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">COLORING BOOK</text>
    <text x="80" y="120" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F472B6" text-anchor="middle">K-POP ANIME DEMON</text>
  </g>

  <!-- Slime Tubs (Pink & Neon Yellow) -->
