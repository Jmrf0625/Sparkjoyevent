<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKpop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgKpop)"/>

  <!-- PURPLE & BLUE K-POP DEMON HUNTERS GIFT BAGS (AMNA TURNS 5) -->
