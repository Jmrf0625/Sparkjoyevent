<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F5"/>
      <stop offset="100%" stop-color="#FFE3E3"/>
    </linearGradient>
    <linearGradient id="tissueGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="tissueRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgHero)"/>

  <!-- Shimmer Backdrop grid lines -->
  <g stroke="#FCA5A5" stroke-width="1" stroke-dasharray="8 8" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>

  <!-- ROW OF 4 RED SUPERHERO GIRL GIFT BAGS -->
  <!-- Bag 1 -->
  <g transform="translate(70, 120)">
    <path d="M 20 -20 L 40 20 L 60 -30 L 80 20 L 100 -20 L 110 40 Z" fill="url(#tissueGold)"/>
    <path d="M 30 -10 L 50 30 L 70 -10 L 90 30 L 100 40 Z" fill="url(#tissueRed)"/>
    <path d="M 35 40 Q 60 10 85 40" stroke="#FFFFFF" stroke-width="4" fill="none"/>
    <rect x="15" y="40" width="90" height="180" rx="10" fill="#DC2626" stroke="#991B1B" stroke-width="3"/>
    <!-- Sticker -->
    <rect x="22" y="100" width="76" height="50" fill="#E0F2FE" rx="6" stroke="#0284C7" stroke-width="2"/>
    <circle cx="42" cy="125" r="14" fill="#FACC15"/>
    <!-- Cartoon Superhero Girl -->
    <path d="M 35 120 Q 42 110 49 120 Q 42 135 35 120 Z" fill="#DC2626"/>
    <text x="68" y="130" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0369A1" text-anchor="middle">البطلة</text>
    <text x="68" y="141" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0369A1" text-anchor="middle">الصغيرة</text>
  </g>

  <!-- Bag 2 (Center Left) -->
  <g transform="translate(230, 90)">
    <path d="M 25 -30 L 55 30 L 85 -40 L 115 30 L 145 -30 L 160 50 Z" fill="url(#tissueGold)"/>
    <path d="M 40 -15 L 70 40 L 100 -20 L 130 40 Z" fill="url(#tissueRed)"/>
    <path d="M 45 50 Q 80 10 115 50" stroke="#FFFFFF" stroke-width="5" fill="none"/>
    <rect x="15" y="50" width="130" height="210" rx="14" fill="#DC2626" stroke="#991B1B" stroke-width="4"/>
    <!-- Big Sticker -->
    <rect x="25" y="120" width="110" height="70" fill="#E0F2FE" rx="8" stroke="#0284C7" stroke-width="3"/>
    <circle cx="50" cy="155" r="20" fill="#FACC15"/>
    <path d="M 40 150 Q 50 135 60 150 Q 50 170 40 150 Z" fill="#DC2626"/>
    <text x="90" y="152" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369A1" text-anchor="middle">البطلة</text>
    <text x="90" y="168" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369A1" text-anchor="middle">الصغيرة</text>
  </g>

  <!-- Bag 3 (Center Right) -->
  <g transform="translate(420, 90)">
    <path d="M 25 -30 L 55 30 L 85 -40 L 115 30 L 145 -30 L 160 50 Z" fill="url(#tissueGold)"/>
    <path d="M 40 -15 L 70 40 L 100 -20 L 130 40 Z" fill="url(#tissueRed)"/>
    <path d="M 45 50 Q 80 10 115 50" stroke="#FFFFFF" stroke-width="5" fill="none"/>
    <rect x="15" y="50" width="130" height="210" rx="14" fill="#DC2626" stroke="#991B1B" stroke-width="4"/>
    <rect x="25" y="120" width="110" height="70" fill="#E0F2FE" rx="8" stroke="#0284C7" stroke-width="3"/>
    <circle cx="50" cy="155" r="20" fill="#FACC15"/>
    <path d="M 40 150 Q 50 135 60 150 Q 50 170 40 150 Z" fill="#DC2626"/>
    <text x="90" y="152" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369A1" text-anchor="middle">البطلة</text>
    <text x="90" y="168" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369A1" text-anchor="middle">الصغيرة</text>
  </g>

  <!-- Bag 4 -->
  <g transform="translate(620, 120)">
    <path d="M 20 -20 L 40 20 L 60 -30 L 80 20 L 100 -20 L 110 40 Z" fill="url(#tissueGold)"/>
    <path d="M 30 -10 L 50 30 L 70 -10 L 90 30 L 100 40 Z" fill="url(#tissueRed)"/>
    <path d="M 35 40 Q 60 10 85 40" stroke="#FFFFFF" stroke-width="4" fill="none"/>
    <rect x="15" y="40" width="90" height="180" rx="10" fill="#DC2626" stroke="#991B1B" stroke-width="3"/>
    <rect x="22" y="100" width="76" height="50" fill="#E0F2FE" rx="6" stroke="#0284C7" stroke-width="2"/>
    <circle cx="42" cy="125" r="14" fill="#FACC15"/>
    <text x="68" y="130" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0369A1" text-anchor="middle">البطلة</text>
    <text x="68" y="141" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0369A1" text-anchor="middle">الصغيرة</text>
  </g>

  <!-- FRONT TABLE DISPLAY ITEMS (Slime, Soap Spheres, Bubbles, Cones, Bow & Arrow Sets) -->
  <!-- Slime Tubs with Superhero Girl Lid -->
  <g transform="translate(180, 360)">
    <rect x="0" y="0" width="90" height="60" rx="12" fill="#BAE6FD" stroke="#0284C7" stroke-width="3"/>
    <ellipse cx="45" cy="0" rx="48" ry="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <text x="45" y="36" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369A1" text-anchor="middle">SLIME</text>
  </g>
  <g transform="translate(530, 360)">
    <rect x="0" y="0" width="90" height="60" rx="12" fill="#BAE6FD" stroke="#0284C7" stroke-width="3"/>
    <ellipse cx="45" cy="0" rx="48" ry="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <text x="45" y="36" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369A1" text-anchor="middle">SLIME</text>
  </g>

  <!-- Blue Bath Spheres in Center -->
  <circle cx="350" cy="390" r="32" fill="#38BDF8" stroke="#0284C7" stroke-width="3"/>
  <circle cx="440" cy="390" r="32" fill="#38BDF8" stroke="#0284C7" stroke-width="3"/>

  <!-- Bubble Wand Bottles -->
  <g transform="translate(120, 350)">
    <rect x="0" y="0" width="30" height="80" rx="8" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
    <circle cx="15" cy="-10" r="14" fill="#EC4899"/>
  </g>
  <g transform="translate(650, 350)">
    <rect x="0" y="0" width="30" height="80" rx="8" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
    <circle cx="15" cy="-10" r="14" fill="#EC4899"/>
  </g>

  <!-- Toy Bow & Arrow Sets (Bottom) -->
  <g transform="translate(280, 450)">
    <rect x="0" y="0" width="240" height="60" rx="10" fill="#FFFFFF" stroke="#F43F5E" stroke-width="2" opacity="0.9"/>
    <path d="M 20 30 Q 120 0 220 30" stroke="#EC4899" stroke-width="6" fill="none"/>
    <line x1="20" y1="30" x2="220" y2="30" stroke="#FACC15" stroke-width="3"/>
    <text x="120" y="50" font-family="sans-serif" font-size="10" font-weight="bold" fill="#991B1B" text-anchor="middle">SUPERHERO ARCHERY TOY SET</text>
  </g>

  <!-- Title Badge -->
  <rect x="140" y="525" width="520" height="50" rx="25" fill="#991B1B"/>
  <text x="400" y="557" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SUPERHERO GIRL CUSTOM GOODIE BAGS</text>
</svg>
