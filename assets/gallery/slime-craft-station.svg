<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Clean Pastel Pink Flatlay Surface -->
    <linearGradient id="bgPastel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="40%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>

    <!-- Box Shadow -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#831843" flood-opacity="0.12"/>
    </filter>

    <filter id="itemShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#701A75" flood-opacity="0.15"/>
    </filter>

    <!-- Holographic Pastel Drip Pattern for Labels -->
    <linearGradient id="holoLabel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="25%" stop-color="#FCE7F3"/>
      <stop offset="50%" stop-color="#DDD6FE"/>
      <stop offset="75%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>

  <!-- Background Surface -->
  <rect width="800" height="1200" fill="url(#bgPastel)"/>

  <!-- ================= TOP LAYER: WHITE SPARK JOY SLIME KITS ================= -->
  <!-- Box Left Upper -->
  <g transform="translate(60, 60)" filter="url(#boxShadow)">
    <rect width="320" height="240" rx="12" fill="#FFFFFF" stroke="#F3E8FF" stroke-width="2"/>
    <!-- Label -->
    <rect x="25" y="25" width="270" height="190" rx="10" fill="url(#holoLabel)" stroke="#F472B6" stroke-width="1.5"/>
    <!-- Drip Header -->
    <path d="M 25,25 Q 70,55 110,35 Q 160,65 210,35 Q 260,55 295,25 Z" fill="#F472B6" opacity="0.3"/>
    <!-- Label Text -->
    <text x="160" y="80" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-weight="900" font-size="28" fill="#9333EA" text-anchor="middle">SLIME</text>
    <text x="160" y="112" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-weight="900" font-size="24" fill="#EC4899" text-anchor="middle">ACTIVITY</text>
    
    <!-- Balloons Illustration on Label -->
    <circle cx="140" cy="140" r="10" fill="#3B82F6"/>
    <circle cx="160" cy="132" r="10" fill="#EC4899"/>
    <circle cx="180" cy="140" r="10" fill="#F59E0B"/>
    <path d="M 140,150 L 160,170 M 160,142 L 160,170 M 180,150 L 160,170" stroke="#8B5CF6" stroke-width="2"/>

    <text x="160" y="185" font-family="sans-serif" font-weight="bold" font-size="11" fill="#6B21A8" text-anchor="middle" letter-spacing="1">SPARK JOY EVENT MANAGEMENT</text>
    <text x="160" y="202" font-family="sans-serif" font-size="10" fill="#9333EA" text-anchor="middle">Create • Mix • Enjoy</text>
  </g>

  <!-- Box Right Upper -->
  <g transform="translate(420, 60)" filter="url(#boxShadow)">
    <rect width="320" height="240" rx="12" fill="#FFFFFF" stroke="#F3E8FF" stroke-width="2"/>
    <rect x="25" y="25" width="270" height="190" rx="10" fill="url(#holoLabel)" stroke="#F472B6" stroke-width="1.5"/>
    <path d="M 25,25 Q 70,55 110,35 Q 160,65 210,35 Q 260,55 295,25 Z" fill="#F472B6" opacity="0.3"/>
    <text x="160" y="80" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-weight="900" font-size="28" fill="#9333EA" text-anchor="middle">SLIME</text>
    <text x="160" y="112" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-weight="900" font-size="24" fill="#EC4899" text-anchor="middle">ACTIVITY</text>

    <circle cx="140" cy="140" r="10" fill="#3B82F6"/>
    <circle cx="160" cy="132" r="10" fill="#EC4899"/>
    <circle cx="180" cy="140" r="10" fill="#F59E0B"/>
    <path d="M 140,150 L 160,170 M 160,142 L 160,170 M 180,150 L 160,170" stroke="#8B5CF6" stroke-width="2"/>

    <text x="160" y="185" font-family="sans-serif" font-weight="bold" font-size="11" fill="#6B21A8" text-anchor="middle" letter-spacing="1">SPARK JOY EVENT MANAGEMENT</text>
    <text x="160" y="202" font-family="sans-serif" font-size="10" fill="#9333EA" text-anchor="middle">Create • Mix • Enjoy</text>
  </g>

  <!-- Side Stack Boxes Left & Right -->
  <rect x="10" y="320" width="280" height="160" rx="10" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="2" filter="url(#boxShadow)"/>
  <rect x="510" y="320" width="280" height="160" rx="10" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="2" filter="url(#boxShadow)"/>

  <!-- Middle Kit Card -->
  <g transform="translate(260, 290)" filter="url(#boxShadow)">
    <rect width="280" height="150" rx="8" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
    <rect x="15" y="15" width="250" height="120" rx="6" fill="url(#holoLabel)"/>
    <text x="140" y="55" font-family="'Comic Sans MS', cursive" font-weight="bold" font-size="20" fill="#9333EA" text-anchor="middle">SLIME ACTIVITY</text>
    <text x="140" y="85" font-family="sans-serif" font-size="10" fill="#7E22CE" text-anchor="middle" font-weight="bold">SPARK JOY EVENT MANAGEMENT</text>
    <text x="140" y="105" font-family="sans-serif" font-size="9" fill="#A855F7" text-anchor="middle">Create • Mix • Enjoy</text>
  </g>

  <!-- ================= ROUND SLIME CONTAINERS WITH BALLOON DOG TOPPERS ================= -->
  <!-- Left Tub with Blue Balloon Dog -->
  <g transform="translate(260, 520)" filter="url(#itemShadow)">
    <circle cx="0" cy="0" r="100" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
    <circle cx="0" cy="0" r="92" fill="#F8FAFC"/>
    <!-- Lid Label -->
    <circle cx="0" cy="0" r="80" fill="url(#holoLabel)" stroke="#F472B6" stroke-width="1.5"/>
    <text x="0" y="-20" font-family="sans-serif" font-weight="900" font-size="16" fill="#9333EA" text-anchor="middle">SLIME ACTIVITY</text>
    <text x="0" y="5" font-family="sans-serif" font-size="8" fill="#7E22CE" text-anchor="middle" font-weight="bold">SPARK JOY EVENT MANAGEMENT</text>

    <!-- Blue Balloon Dog Toy on Top -->
    <g transform="translate(-10, -85) scale(0.9)" filter="url(#itemShadow)">
      <ellipse cx="0" cy="0" rx="14" ry="10" fill="#3B82F6"/>
      <circle cx="-12" cy="-8" r="8" fill="#60A5FA"/>
      <ellipse cx="14" cy="2" rx="12" ry="8" fill="#3B82F6"/>
      <ellipse cx="28" cy="12" rx="10" ry="7" fill="#2563EB"/>
      <!-- Legs -->
      <rect x="-8" y="8" width="6" height="18" rx="3" fill="#1D4ED8"/>
      <rect x="4" y="8" width="6" height="18" rx="3" fill="#1D4ED8"/>
      <rect x="20" y="18" width="6" height="16" rx="3" fill="#1D4ED8"/>
    </g>

    <!-- Cute Charms inside Tub -->
    <circle cx="-40" cy="35" r="8" fill="#EF4444"/>
    <polygon points="35,25 40,35 48,35 41,40 44,50 35,43 26,50 29,40 22,35 30,35" fill="#F59E0B"/>
    <rect x="-10" y="30" width="16" height="16" rx="4" fill="#EC4899"/>
  </g>

  <!-- Right Tub with Pink Balloon Dog -->
  <g transform="translate(540, 520)" filter="url(#itemShadow)">
    <circle cx="0" cy="0" r="100" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
    <circle cx="0" cy="0" r="92" fill="#F8FAFC"/>
    <circle cx="0" cy="0" r="80" fill="url(#holoLabel)" stroke="#F472B6" stroke-width="1.5"/>
    <text x="0" y="-20" font-family="sans-serif" font-weight="900" font-size="16" fill="#9333EA" text-anchor="middle">SLIME ACTIVITY</text>
    <text x="0" y="5" font-family="sans-serif" font-size="8" fill="#7E22CE" text-anchor="middle" font-weight="bold">SPARK JOY EVENT MANAGEMENT</text>

    <!-- Pink Balloon Dog Toy -->
    <g transform="translate(10, -85) scale(0.9)" filter="url(#itemShadow)">
      <ellipse cx="0" cy="0" rx="14" ry="10" fill="#EC4899"/>
      <circle cx="-12" cy="-8" r="8" fill="#F472B6"/>
      <ellipse cx="14" cy="2" rx="12" ry="8" fill="#EC4899"/>
      <ellipse cx="28" cy="12" rx="10" ry="7" fill="#DB2777"/>
      <rect x="-8" y="8" width="6" height="18" rx="3" fill="#BE185D"/>
      <rect x="4" y="8" width="6" height="18" rx="3" fill="#BE185D"/>
      <rect x="20" y="18" width="6" height="16" rx="3" fill="#BE185D"/>
    </g>

    <circle cx="-30" cy="35" r="8" fill="#3B82F6"/>
    <polygon points="35,25 40,35 48,35 41,40 44,50 35,43 26,50 29,40 22,35 30,35" fill="#F472B6"/>
    <rect x="-10" y="30" width="16" height="16" rx="4" fill="#10B981"/>
  </g>

  <!-- Rainbow Slinky Rings Side Extras -->
  <circle cx="155" cy="540" r="28" fill="none" stroke="#22C55E" stroke-width="6" filter="url(#itemShadow)"/>
  <circle cx="155" cy="540" r="22" fill="none" stroke="#EAB308" stroke-width="5"/>
  <circle cx="645" cy="540" r="28" fill="none" stroke="#3B82F6" stroke-width="6" filter="url(#itemShadow)"/>
  <circle cx="645" cy="540" r="22" fill="none" stroke="#EC4899" stroke-width="5"/>

  <!-- ================= CENTER SLIME RECIPE GUIDE CARD ================= -->
  <g transform="translate(400, 830)" filter="url(#boxShadow)">
    <rect x="-130" y="-190" width="260" height="360" rx="14" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="2"/>
    <rect x="-120" y="-180" width="240" height="340" rx="10" fill="url(#holoLabel)"/>
    
    <!-- Title -->
    <text x="0" y="-140" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="20" fill="#7E22CE" text-anchor="middle">CLASSIC</text>
    <text x="0" y="-115" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="18" fill="#EC4899" text-anchor="middle">SLIME RECIPE</text>
    
    <text x="0" y="-95" font-family="sans-serif" font-size="8" fill="#6B21A8" text-anchor="middle" font-weight="bold">SPARK JOY EVENT MANAGEMENT</text>

    <!-- Recipe Step Illustrations -->
    <!-- Step 1 -->
    <rect x="-110" y="-80" width="100" height="60" rx="6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="-95" cy="-65" r="8" fill="#EC4899"/>
    <text x="-95" y="-62" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
    <text x="-80" y="-60" font-size="8" fill="#4C1D95" font-family="sans-serif">Add color to glue</text>

    <!-- Step 2 -->
    <rect x="10" y="-80" width="100" height="60" rx="6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="25" cy="-65" r="8" fill="#EC4899"/>
    <text x="25" y="-62" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
    <text x="40" y="-60" font-size="8" fill="#4C1D95" font-family="sans-serif">Add activator 1</text>

    <!-- Step 3 -->
    <rect x="-110" y="-10" width="100" height="60" rx="6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="-95" cy="5" r="8" fill="#EC4899"/>
    <text x="-95" y="8" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
    <text x="-80" y="10" font-size="8" fill="#4C1D95" font-family="sans-serif">Add activator 2</text>

    <!-- Step 4 -->
    <rect x="10" y="-10" width="100" height="60" rx="6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="25" cy="5" r="8" fill="#EC4899"/>
    <text x="25" y="8" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
    <text x="40" y="10" font-size="8" fill="#4C1D95" font-family="sans-serif">Decorate &amp; knead</text>

    <!-- Footer note -->
    <text x="0" y="135" font-family="sans-serif" font-weight="bold" font-size="9" fill="#7E22CE" text-anchor="middle">Enjoy your slime with Spark Joy!</text>
  </g>

  <!-- ================= INGREDIENTS & CLAY PACKETS ================= -->
  <!-- Left Side Supplies -->
  <!-- Toppings Bag Left -->
  <g transform="translate(130, 630)" filter="url(#itemShadow)">
    <rect x="-50" y="-35" width="100" height="70" rx="6" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1.5"/>
    <rect x="-45" y="-30" width="90" height="20" rx="4" fill="url(#holoLabel)"/>
    <text x="0" y="-16" font-family="sans-serif" font-weight="bold" font-size="10" fill="#9333EA" text-anchor="middle">TOPPINGS</text>
    <!-- Gold Glitter inside -->
    <rect x="-42" y="-5" width="84" height="35" fill="#FEF08A" opacity="0.8"/>
    <circle cx="-20" cy="10" r="2" fill="#EAB308"/><circle cx="0" cy="5" r="2.5" fill="#D97706"/><circle cx="20" cy="15" r="2" fill="#CA8A04"/>
  </g>

  <!-- Activators Left (Small round tubs) -->
  <g transform="translate(230, 680)" filter="url(#itemShadow)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#C084FC" stroke-width="1.5"/>
    <text x="0" y="-4" font-family="sans-serif" font-weight="bold" font-size="7" fill="#7E22CE" text-anchor="middle">ACTIVATOR</text>
    <text x="0" y="8" font-family="sans-serif" font-weight="900" font-size="11" fill="#3B82F6" text-anchor="middle">#1</text>
  </g>

  <g transform="translate(230, 750)" filter="url(#itemShadow)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#C084FC" stroke-width="1.5"/>
    <text x="0" y="-4" font-family="sans-serif" font-weight="bold" font-size="7" fill="#7E22CE" text-anchor="middle">ACTIVATOR</text>
    <text x="0" y="8" font-family="sans-serif" font-weight="900" font-size="11" fill="#3B82F6" text-anchor="middle">#2</text>
  </g>

  <g transform="translate(230, 820)" filter="url(#itemShadow)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#C084FC" stroke-width="1.5"/>
    <text x="0" y="4" font-family="sans-serif" font-weight="900" font-size="10" fill="#EC4899" text-anchor="middle">COLOR</text>
  </g>

  <!-- Blue Clay Packet -->
  <g transform="translate(130, 800)" filter="url(#itemShadow)">
    <rect x="-45" y="-30" width="90" height="60" rx="8" fill="#2563EB"/>
    <rect x="-40" y="-25" width="80" height="50" rx="6" fill="#3B82F6"/>
  </g>

  <!-- Purple Spoon Left -->
  <path d="M 80,900 C 130,900 160,890 200,890 L 200,905 C 160,905 130,915 80,915 Z" fill="#A855F7" filter="url(#itemShadow)"/>
  <circle cx="70" cy="907" r="15" fill="#A855F7"/>


  <!-- Right Side Supplies -->
  <!-- Toppings Bag Right -->
  <g transform="translate(670, 630)" filter="url(#itemShadow)">
    <rect x="-50" y="-35" width="100" height="70" rx="6" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1.5"/>
    <rect x="-45" y="-30" width="90" height="20" rx="4" fill="url(#holoLabel)"/>
    <text x="0" y="-16" font-family="sans-serif" font-weight="bold" font-size="10" fill="#9333EA" text-anchor="middle">TOPPINGS</text>
    <!-- Sprinkles inside -->
    <circle cx="-25" cy="5" r="3" fill="#EF4444"/>
    <circle cx="-10" cy="15" r="3" fill="#F59E0B"/>
    <circle cx="10" cy="8" r="3" fill="#10B981"/>
    <circle cx="25" cy="16" r="3" fill="#3B82F6"/>
  </g>

  <!-- Activators Right -->
  <g transform="translate(570, 680)" filter="url(#itemShadow)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#C084FC" stroke-width="1.5"/>
    <text x="0" y="-4" font-family="sans-serif" font-weight="bold" font-size="7" fill="#7E22CE" text-anchor="middle">ACTIVATOR</text>
    <text x="0" y="8" font-family="sans-serif" font-weight="900" font-size="11" fill="#3B82F6" text-anchor="middle">#1</text>
  </g>

  <g transform="translate(570, 750)" filter="url(#itemShadow)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#C084FC" stroke-width="1.5"/>
    <text x="0" y="-4" font-family="sans-serif" font-weight="bold" font-size="7" fill="#7E22CE" text-anchor="middle">ACTIVATOR</text>
    <text x="0" y="8" font-family="sans-serif" font-weight="900" font-size="11" fill="#3B82F6" text-anchor="middle">#2</text>
  </g>

  <g transform="translate(570, 820)" filter="url(#itemShadow)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#C084FC" stroke-width="1.5"/>
    <text x="0" y="4" font-family="sans-serif" font-weight="900" font-size="10" fill="#EC4899" text-anchor="middle">COLOR</text>
  </g>

  <!-- Pink Clay Packet -->
  <g transform="translate(670, 800)" filter="url(#itemShadow)">
    <rect x="-45" y="-30" width="90" height="60" rx="8" fill="#EC4899"/>
    <rect x="-40" y="-25" width="80" height="50" rx="6" fill="#F472B6"/>
  </g>

  <!-- Purple Spoon Right -->
  <path d="M 720,900 C 670,900 640,890 600,890 L 600,905 C 640,905 670,915 720,915 Z" fill="#A855F7" filter="url(#itemShadow)"/>
  <circle cx="730" cy="907" r="15" fill="#A855F7"/>

</svg>
