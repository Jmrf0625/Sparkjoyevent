<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pinataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#F8C7DC" />
    </linearGradient>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E92D72" />
      <stop offset="25%" stop-color="#FF9F1C" />
      <stop offset="50%" stop-color="#FFD166" />
      <stop offset="75%" stop-color="#06D6A0" />
      <stop offset="100%" stop-color="#8338EC" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#pinataGrad)"/>

  <!-- Hanging Piñata Rope -->
  <line x1="400" y1="0" x2="400" y2="140" stroke="#111B3A" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Unicorn Piñata Body -->
  <g transform="translate(260, 140)">
    <!-- Unicorn Head & Neck -->
    <path d="M 120 40 Q 200 -20 240 40 Q 220 120 160 120 Z" fill="#FFFFFF" stroke="#111B3A" stroke-width="4"/>
    <!-- Horn -->
    <path d="M 220 20 L 270 -40 L 200 0 Z" fill="url(#rainbowGrad)" stroke="#111B3A" stroke-width="3"/>
    <!-- Body -->
    <ellipse cx="120" cy="160" rx="90" ry="60" fill="#FFFFFF" stroke="#111B3A" stroke-width="4"/>
    <!-- Colorful Fringe Ribbons (Tassels) -->
    <path d="M 30 180 L 10 280 L 35 280 L 50 190 Z" fill="#E92D72"/>
    <path d="M 60 190 L 50 290 L 75 290 L 85 195 Z" fill="#FFD166"/>
    <path d="M 95 195 L 90 295 L 115 295 L 120 195 Z" fill="#06D6A0"/>
    <path d="M 130 195 L 135 290 L 160 290 L 155 190 Z" fill="#8338EC"/>
    <path d="M 165 185 L 180 275 L 205 275 L 190 175 Z" fill="#FF9F1C"/>
    <!-- Mane Ribbons -->
    <path d="M 140 10 Q 110 -20 80 20" stroke="#E92D72" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 155 30 Q 125 0 95 40" stroke="#FFD166" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 170 50 Q 140 20 110 60" stroke="#8338EC" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Eye & Cheek -->
    <circle cx="200" cy="45" r="5" fill="#111B3A"/>
    <circle cx="185" cy="60" r="10" fill="#F8C7DC"/>
  </g>

  <!-- Title Badge -->
  <rect x="180" y="490" width="440" height="50" rx="25" fill="#111B3A"/>
  <text x="400" y="523" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">HANDCRAFTED UNICORN PIÑATA</text>
</svg>
