<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <!-- Silver Shimmer Grid Backdrop -->
    <linearGradient id="silverWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Table Surface -->
    <linearGradient id="pinkTable" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="itemShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1E293B" flood-opacity="0.18"/>
    </filter>

    <filter id="shimmerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Wallpaper: Silver Shimmer Sequin Grid Wall -->
  <rect width="800" height="600" fill="url(#silverWall)"/>
  
  <!-- Silver Grid Lines -->
  <g stroke="#94A3B8" stroke-width="2" opacity="0.6">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    
    <line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
  </g>

  <!-- Shimmer Reflective Tiles -->
  <g fill="#FFFFFF" opacity="0.4">
    <rect x="20" y="20" width="120" height="60" rx="4"/>
    <rect x="180" y="120" width="120" height="60" rx="4"/>
    <rect x="340" y="40" width="120" height="60" rx="4"/>
    <rect x="500" y="220" width="120" height="60" rx="4"/>
    <rect x="660" y="100" width="120" height="60" rx="4"/>
  </g>

  <!-- Table Surface -->
  <rect y="550" width="800" height="550" fill="url(#pinkTable)"/>

  <!-- ================= BACKGROUND FAVOR BAGS (Ali's 3rd Birthday Soccer Theme) ================= -->
  
  <!-- Bag 1 (Far Left) -->
  <g transform="translate(30, 220)" filter="url(#itemShadow)">
    <!-- Tissue Paper Tufts -->
    <polygon points="10,-60 30,-120 60,-40" fill="#3B82F6"/>
    <polygon points="40,-50 70,-110 90,-40" fill="#EAB308"/>
    <polygon points="70,-40 100,-100 120,-30" fill="#E2E8F0"/>
    
    <!-- Bag Body -->
    <rect width="140" height="180" fill="#FFFFFF" rx="6" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Handle -->
    <path d="M 45,0 C 45,-35 95,-35 95,0" stroke="#FFFFFF" stroke-width="5" fill="none"/>
    <path d="M 45,0 C 45,-35 95,-35 95,0" stroke="#CBD5E1" stroke-width="2" fill="none"/>

    <!-- Blue Ribbon Bow -->
    <path d="M 70,20 Q 50,5 30,20 Q 50,30 70,20 Q 90,5 110,20 Q 90,30 70,20 Z" fill="#60A5FA"/>

    <!-- Soccer Custom Tag -->
    <rect x="15" y="40" width="110" height="120" rx="6" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="70" cy="80" r="22" fill="#2563EB"/>
    <!-- Soccer ball icon -->
    <circle cx="70" cy="80" r="16" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
    <polygon points="70,72 75,76 73,82 67,82 65,76" fill="#000"/>
    <text x="70" y="122" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="14" fill="#1E3A8A" text-anchor="middle">Ali's 3rd</text>
    <text x="70" y="140" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1D4ED8" text-anchor="middle">BIRTHDAY</text>
  </g>

  <!-- Bag 2 (Center Left) -->
  <g transform="translate(220, 200)" filter="url(#itemShadow)">
    <polygon points="10,-60 30,-120 60,-40" fill="#3B82F6"/>
    <polygon points="40,-50 70,-110 90,-40" fill="#EAB308"/>
    <polygon points="70,-40 100,-100 120,-30" fill="#E2E8F0"/>
    
    <rect width="150" height="190" fill="#FFFFFF" rx="6" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M 50,0 C 50,-35 100,-35 100,0" stroke="#FFFFFF" stroke-width="5" fill="none"/>
    
    <!-- Pink Bow -->
    <path d="M 75,20 Q 55,5 35,20 Q 55,30 75,20 Q 95,5 115,20 Q 95,30 75,20 Z" fill="#EC4899"/>

    <rect x="15" y="45" width="120" height="125" rx="6" fill="#F8FAFC" stroke="#EC4899" stroke-width="1.5"/>
    <circle cx="75" cy="85" r="24" fill="#1E3A8A"/>
    <circle cx="75" cy="85" r="18" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
    <polygon points="75,77 80,81 78,87 72,87 70,81" fill="#000"/>
    <text x="75" y="130" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="16" fill="#1E3A8A" text-anchor="middle">Ali's 3rd</text>
    <text x="75" y="150" font-family="sans-serif" font-weight="bold" font-size="12" fill="#EC4899" text-anchor="middle">BIRTHDAY</text>
  </g>

  <!-- Bag 3 (Center Right) -->
  <g transform="translate(420, 200)" filter="url(#itemShadow)">
    <polygon points="10,-60 30,-120 60,-40" fill="#3B82F6"/>
    <polygon points="40,-50 70,-110 90,-40" fill="#EAB308"/>
    <polygon points="70,-40 100,-100 120,-30" fill="#E2E8F0"/>
    
    <rect width="150" height="190" fill="#FFFFFF" rx="6" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M 50,0 C 50,-35 100,-35 100,0" stroke="#FFFFFF" stroke-width="5" fill="none"/>

    <!-- Light Blue Bow -->
    <path d="M 75,20 Q 55,5 35,20 Q 55,30 75,20 Q 95,5 115,20 Q 95,30 75,20 Z" fill="#38BDF8"/>

    <rect x="15" y="45" width="120" height="125" rx="6" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="75" cy="85" r="24" fill="#2563EB"/>
    <circle cx="75" cy="85" r="18" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
    <polygon points="75,77 80,81 78,87 72,87 70,81" fill="#000"/>
    <text x="75" y="130" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="16" fill="#1E3A8A" text-anchor="middle">Ali's 3rd</text>
    <text x="75" y="150" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1D4ED8" text-anchor="middle">BIRTHDAY</text>
  </g>

  <!-- Bag 4 (Far Right) -->
  <g transform="translate(610, 220)" filter="url(#itemShadow)">
    <polygon points="10,-60 30,-120 60,-40" fill="#3B82F6"/>
    <polygon points="40,-50 70,-110 90,-40" fill="#EAB308"/>
    <polygon points="70,-40 100,-100 120,-30" fill="#E2E8F0"/>
    
    <rect width="140" height="180" fill="#FFFFFF" rx="6" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M 45,0 C 45,-35 95,-35 95,0" stroke="#FFFFFF" stroke-width="5" fill="none"/>

    <path d="M 70,20 Q 50,5 30,20 Q 50,30 70,20 Q 90,5 110,20 Q 90,30 70,20 Z" fill="#F472B6"/>

    <rect x="15" y="40" width="110" height="120" rx="6" fill="#F8FAFC" stroke="#EC4899" stroke-width="1.5"/>
    <circle cx="70" cy="80" r="22" fill="#1E3A8A"/>
    <circle cx="70" cy="80" r="16" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
    <text x="70" y="122" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="14" fill="#1E3A8A" text-anchor="middle">Ali's 3rd</text>
    <text x="70" y="140" font-family="sans-serif" font-weight="bold" font-size="11" fill="#EC4899" text-anchor="middle">BIRTHDAY</text>
  </g>

  <!-- ================= FOREGROUND GOODIES FLATLAY ================= -->
  
  <!-- BUBBLES BOTTLES PACK (Center Top) -->
  <g transform="translate(320, 480)" filter="url(#itemShadow)">
    <rect x="0" y="0" width="160" height="90" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <!-- Colorful Bubble Wand Tops -->
    <rect x="15" y="-20" width="12" height="30" rx="4" fill="#3B82F6"/>
    <rect x="35" y="-25" width="12" height="35" rx="4" fill="#EC4899"/>
    <rect x="55" y="-20" width="12" height="30" rx="4" fill="#10B981"/>
    <rect x="75" y="-25" width="12" height="35" rx="4" fill="#F59E0B"/>
    <rect x="95" y="-20" width="12" height="30" rx="4" fill="#8B5CF6"/>
    <rect x="115" y="-25" width="12" height="35" rx="4" fill="#EF4444"/>
    <rect x="135" y="-20" width="12" height="30" rx="4" fill="#06B6D4"/>
    
    <!-- Header Tag -->
    <rect x="10" y="25" width="140" height="55" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
    <text x="70" y="58" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="20" fill="#1D4ED8" text-anchor="middle" letter-spacing="2">BUBBLES</text>
  </g>

  <!-- COLOR PENS PACK (Left) -->
  <g transform="translate(30, 560)" filter="url(#itemShadow)">
    <rect width="180" height="100" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Color Pen Caps -->
    <rect x="10" y="10" width="160" height="35" fill="#3B82F6" opacity="0.1" rx="4"/>
    <rect x="15" y="15" width="10" height="25" rx="2" fill="#EF4444"/>
    <rect x="30" y="15" width="10" height="25" rx="2" fill="#F59E0B"/>
    <rect x="45" y="15" width="10" height="25" rx="2" fill="#10B981"/>
    <rect x="60" y="15" width="10" height="25" rx="2" fill="#3B82F6"/>
    <rect x="75" y="15" width="10" height="25" rx="2" fill="#8B5CF6"/>
    <rect x="90" y="15" width="10" height="25" rx="2" fill="#EC4899"/>
    <rect x="105" y="15" width="10" height="25" rx="2" fill="#06B6D4"/>
    <rect x="120" y="15" width="10" height="25" rx="2" fill="#84CC16"/>

    <text x="90" y="70" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="20" fill="#DC2626" text-anchor="middle">COLOR PENS</text>
  </g>

  <!-- SLIME TUBS (Middle Left & Right) -->
  <!-- Blue Slime Tub -->
  <g transform="translate(250, 590)" filter="url(#itemShadow)">
    <circle cx="0" cy="0" r="50" fill="#93C5FD" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="0" cy="0" r="42" fill="#FFFFFF"/>
    <!-- Soccer Character Sticker -->
    <circle cx="0" cy="0" r="32" fill="#EFF6FF"/>
    <circle cx="0" cy="-6" r="12" fill="#FCA5A5"/>
    <circle cx="0" cy="-8" r="10" fill="#451A03"/>
    <rect x="-8" y="6" width="16" height="18" fill="#1E3A8A"/>
    <text x="0" y="32" font-family="sans-serif" font-weight="bold" font-size="8" fill="#1D4ED8" text-anchor="middle">SLIME</text>
  </g>

  <!-- Purple Slime Tub -->
  <g transform="translate(550, 610)" filter="url(#itemShadow)">
    <circle cx="0" cy="0" r="50" fill="#C084FC" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="0" cy="0" r="42" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="32" fill="#F3E8FF"/>
    <circle cx="0" cy="-6" r="12" fill="#FCA5A5"/>
    <circle cx="0" cy="-8" r="10" fill="#451A03"/>
    <rect x="-8" y="6" width="16" height="18" fill="#1E3A8A"/>
    <text x="0" y="32" font-family="sans-serif" font-weight="bold" font-size="8" fill="#7E22CE" text-anchor="middle">SLIME</text>
  </g>

  <!-- SOCCER COLORING BOOKS (Center Bottom) -->
  <!-- Book 1 -->
  <g transform="translate(240, 680)" filter="url(#itemShadow)">
    <rect width="150" height="210" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="8" y="8" width="134" height="194" rx="6" fill="#60A5FA"/>
    <!-- Header Banner -->
    <text x="75" y="40" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">COLORING</text>
    <text x="75" y="62" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="20" fill="#FEF08A" text-anchor="middle">BOOK</text>
    
    <!-- Soccer Field & Goal illustration -->
    <rect x="20" y="80" width="110" height="100" fill="#22C55E" rx="4"/>
    <rect x="40" y="90" width="70" height="40" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="75" cy="140" r="15" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
  </g>

  <!-- Book 2 -->
  <g transform="translate(410, 680)" filter="url(#itemShadow)">
    <rect width="150" height="210" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="8" y="8" width="134" height="194" rx="6" fill="#60A5FA"/>
    <text x="75" y="40" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">COLORING</text>
    <text x="75" y="62" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="20" fill="#FEF08A" text-anchor="middle">BOOK</text>

    <rect x="20" y="80" width="110" height="100" fill="#22C55E" rx="4"/>
    <rect x="40" y="90" width="70" height="40" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="75" cy="140" r="15" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
  </g>

  <!-- MARSHMALLOW CANDY CONES (Left & Right) -->
  <!-- Left Cone -->
  <g transform="translate(180, 660) rotate(15)" filter="url(#itemShadow)">
    <polygon points="0,0 -20,120 20,120" fill="#FEF08A"/>
    <polygon points="-22,120 22,120 0,160" fill="#FCA5A5"/>
    <circle cx="0" cy="30" r="16" fill="#FFFFFF"/>
    <circle cx="0" cy="60" r="16" fill="#FCE7F3"/>
    <circle cx="0" cy="90" r="16" fill="#FEF08A"/>
  </g>

  <!-- Right Cone -->
  <g transform="translate(620, 680) rotate(-15)" filter="url(#itemShadow)">
    <polygon points="0,0 -20,120 20,120" fill="#FEF08A"/>
    <polygon points="-22,120 22,120 0,160" fill="#FCA5A5"/>
    <circle cx="0" cy="30" r="16" fill="#FFFFFF"/>
    <circle cx="0" cy="60" r="16" fill="#FCE7F3"/>
    <circle cx="0" cy="90" r="16" fill="#FEF08A"/>
  </g>

  <!-- PUZZLE BOARDS IN FRONT (Paw Patrol & Princesses) -->
  <!-- Paw Patrol Puzzle Left -->
  <g transform="translate(200, 910)" filter="url(#itemShadow)">
    <rect width="190" height="150" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="6" y="6" width="178" height="138" rx="6" fill="#F59E0B"/>
    <text x="95" y="40" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">PUZZLE GAME</text>
    <!-- Cute Paw Print -->
    <circle cx="95" cy="85" r="18" fill="#FFFFFF"/>
    <circle cx="75" cy="65" r="7" fill="#FFFFFF"/>
    <circle cx="95" cy="55" r="7" fill="#FFFFFF"/>
    <circle cx="115" cy="65" r="7" fill="#FFFFFF"/>
  </g>

  <!-- Princess Puzzle Right -->
  <g transform="translate(410, 910)" filter="url(#itemShadow)">
    <rect width="190" height="150" rx="8" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
    <rect x="6" y="6" width="178" height="138" rx="6" fill="#F472B6"/>
    <text x="95" y="40" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">PUZZLE GAME</text>
    <!-- Crown -->
    <polygon points="65,100 70,70 85,85 95,60 105,85 120,70 125,100" fill="#FEF08A"/>
  </g>

</svg>
