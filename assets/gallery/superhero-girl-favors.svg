<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F3"/>
      <stop offset="100%" stop-color="#FFD6E0"/>
    </linearGradient>
    <linearGradient id="goldTissue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#heroBg)"/>

  <!-- Stars & Confetti -->
  <polygon points="100,80 108,100 130,100 112,112 118,132 100,120 82,132 88,112 70,100 92,100" fill="#FFD166"/>
  <polygon points="700,90 706,105 722,105 709,114 714,129 700,120 686,129 691,114 678,105 694,105" fill="#E92D72"/>
  <circle cx="180" cy="500" r="14" fill="#E92D72"/>
  <circle cx="650" cy="480" r="12" fill="#4CC9F0"/>

  <!-- Row of Superhero Girl Gift Bags -->
  <!-- Bag 1 Left -->
  <g transform="translate(100, 160)">
    <!-- Glitter Tissue Top -->
    <path d="M 25 -30 L 45 20 L 65 -40 L 85 20 L 105 -20 L 115 50 L 15 50 Z" fill="url(#goldTissue)"/>
    <path d="M 35 -10 L 55 30 L 75 -20 L 95 30 Z" fill="#D90429"/>
    <!-- Bag handles -->
    <path d="M 40 50 Q 65 10 90 50" stroke="#FFFFFF" stroke-width="5" fill="none"/>
    <!-- Bag body -->
    <rect x="20" y="50" width="90" height="190" rx="12" fill="#D90429" stroke="#900C3F" stroke-width="3"/>
    <!-- Banner on bag -->
    <rect x="25" y="110" width="80" height="40" fill="#4CC9F0" rx="6"/>
    <!-- Arabic superhero label representation -->
    <text x="65" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">البطلة الصغيرة</text>
  </g>

  <!-- Bag 2 Center (Featured Big Bag) -->
  <g transform="translate(260, 120)">
    <!-- Tissue paper top -->
    <path d="M 30 -40 L 60 30 L 90 -50 L 120 30 L 150 -30 L 165 60 L 15 60 Z" fill="url(#goldTissue)"/>
    <path d="M 45 -20 L 75 40 L 105 -30 L 135 40 Z" fill="#D90429"/>
    <!-- Handles -->
    <path d="M 50 60 Q 90 10 130 60" stroke="#FFFFFF" stroke-width="6" fill="none"/>
    <!-- Bag Body -->
    <rect x="20" y="60" width="140" height="240" rx="16" fill="#D90429" stroke="#900C3F" stroke-width="4"/>
    <rect x="28" y="130" width="124" height="60" fill="#4CC9F0" rx="8"/>
    <!-- Girl Superhero Icon -->
    <circle cx="90" cy="150" r="12" fill="#FFD166"/>
    <text x="90" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">البطلة الصغيرة</text>
  </g>

  <!-- Bag 3 Right -->
  <g transform="translate(460, 160)">
    <path d="M 25 -30 L 45 20 L 65 -40 L 85 20 L 105 -20 L 115 50 L 15 50 Z" fill="url(#goldTissue)"/>
    <path d="M 35 -10 L 55 30 L 75 -20 L 95 30 Z" fill="#D90429"/>
    <path d="M 40 50 Q 65 10 90 50" stroke="#FFFFFF" stroke-width="5" fill="none"/>
    <rect x="20" y="50" width="90" height="190" rx="12" fill="#D90429" stroke="#900C3F" stroke-width="3"/>
    <rect x="25" y="110" width="80" height="40" fill="#4CC9F0" rx="6"/>
    <text x="65" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">البطلة الصغيرة</text>
  </g>

  <!-- Foreground Activity Items: Slime Jars, Bubble Bottles & Treat Cones -->
  <!-- Slime Jars -->
  <g transform="translate(220, 390)">
    <rect x="0" y="0" width="70" height="50" rx="10" fill="#80E5FF" stroke="#111B3A" stroke-width="3"/>
    <rect x="-5" y="-10" width="80" height="15" rx="5" fill="#4CC9F0" stroke="#111B3A" stroke-width="2"/>
    <text x="35" y="30" font-family="sans-serif" font-size="10" font-weight="bold" fill="#111B3A" text-anchor="middle">SLIME</text>
  </g>
  <g transform="translate(510, 390)">
    <rect x="0" y="0" width="70" height="50" rx="10" fill="#80E5FF" stroke="#111B3A" stroke-width="3"/>
    <rect x="-5" y="-10" width="80" height="15" rx="5" fill="#4CC9F0" stroke="#111B3A" stroke-width="2"/>
    <text x="35" y="30" font-family="sans-serif" font-size="10" font-weight="bold" fill="#111B3A" text-anchor="middle">SLIME</text>
  </g>

  <!-- Bubble Wand Bottle -->
  <g transform="translate(150, 380)">
    <rect x="0" y="0" width="30" height="70" rx="8" fill="#4CC9F0" stroke="#111B3A" stroke-width="2"/>
    <circle cx="15" cy="-10" r="12" fill="#FF5722"/>
    <text x="15" y="40" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BUBBLES</text>
  </g>

  <!-- Title Badge -->
  <rect x="150" y="500" width="500" height="55" rx="28" fill="#111B3A"/>
  <text x="400" y="535" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SUPERHERO GIRL PARTY PACKAGES</text>
</svg>
