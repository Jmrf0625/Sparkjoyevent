<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1150" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Sparkling Pastel Starburst -->
    <linearGradient id="pastelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="35%" stop-color="#FCE7F3"/>
      <stop offset="70%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#FDF2F8"/>
    </linearGradient>

    <!-- Box Shadow -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#475569" flood-opacity="0.15"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width="800" height="1150" fill="url(#pastelBg)"/>

  <!-- Sparkles background overlay -->
  <g fill="#F59E0B" opacity="0.6">
    <path d="M 100,60 L 104,72 L 116,72 L 107,80 L 110,92 L 100,84 L 90,92 L 93,80 L 84,72 L 96,72 Z"/>
    <path d="M 700,80 L 703,90 L 713,90 L 705,96 L 708,106 L 700,100 L 692,106 L 695,96 L 687,90 L 697,90 Z"/>
    <circle cx="200" cy="120" r="4" fill="#3B82F6"/>
    <circle cx="620" cy="140" r="5" fill="#EC4899"/>
  </g>

  <!-- HEADER TITLE: DIY Superhero & Unicorn Cookie Fun! -->
  <g font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-weight="900" text-anchor="middle">
    <!-- DIY Superhero & -->
    <text x="400" y="85" font-size="44" letter-spacing="1">
      <tspan fill="#EC4899">DIY </tspan>
      <tspan fill="#0284C7">Superhero </tspan>
      <tspan fill="#F59E0B">&amp;</tspan>
    </text>
    <!-- Unicorn Cookie Fun! -->
    <text x="400" y="145" font-size="48" fill="#D946EF" letter-spacing="1">
      Unicorn Cookie Fun!
    </text>
  </g>

  <!-- ================= LEFT KIT: SUPERHERO COOKIE ACTIVITY ================= -->
  <g transform="translate(80, 200)" filter="url(#boxShadow)">
    <!-- Standee Backing Card (How To Decorate Superhero Cookies) -->
    <rect x="0" y="0" width="300" height="240" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="10" y="10" width="280" height="50" rx="8" fill="#1D4ED8"/>
    <text x="150" y="32" font-family="'Comic Sans MS', cursive" font-weight="bold" font-size="12" fill="#FEF08A" text-anchor="middle">HOW TO DECORATE</text>
    <text x="150" y="50" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">SUPERHERO COOKIES</text>

    <!-- Superhero Boy Character Badge -->
    <circle cx="250" cy="35" r="22" fill="#FDE047"/>
    <path d="M 235,35 Q 250,20 265,35 L 265,50 L 235,50 Z" fill="#EF4444"/> <!-- Red Cape -->

    <!-- Instructions steps graphics -->
    <rect x="15" y="70" width="270" height="155" rx="8" fill="#FFFFFF"/>
    <text x="30" y="95" font-weight="bold" font-size="12" fill="#1E3A8A" font-family="sans-serif">1. Warm Up the Icing</text>
    <text x="160" y="95" font-weight="bold" font-size="12" fill="#1E3A8A" font-family="sans-serif">2. Apply the Icing</text>
    <text x="30" y="180" font-weight="bold" font-size="12" fill="#1E3A8A" font-family="sans-serif">3. Decorate &amp; Enjoy!</text>

    <!-- Main Box Front: COOKIES ACTIVITY -->
    <g transform="translate(0, 200)">
      <rect width="300" height="200" rx="12" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2"/>
      <rect x="15" y="20" width="270" height="160" rx="10" fill="#DBEAFE"/>
      
      <text x="150" y="60" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="24" fill="#1E40AF" text-anchor="middle">COOKIES</text>
      <text x="150" y="85" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="20" fill="#3B82F6" text-anchor="middle">ACTIVITY</text>

      <!-- Decorated Superhero Cookie Illustration on Box -->
      <path d="M 110,130 L 150,110 L 190,130 L 180,165 L 120,165 Z" fill="#F59E0B"/> <!-- Shield -->
      <path d="M 120,135 L 150,120 L 180,135 L 175,155 L 125,155 Z" fill="#EF4444"/> <!-- Red Emblem -->
      <text x="150" y="150" font-family="sans-serif" font-weight="900" font-size="16" fill="#FEF08A" text-anchor="middle">S</text>

      <text x="150" y="175" font-family="sans-serif" font-weight="bold" font-size="10" fill="#1E3A8A" text-anchor="middle">SPARK JOY EVENT MANAGEMENT</text>
    </g>

    <!-- Clear Sprinkle Tubs sitting on Box Top -->
    <g transform="translate(20, 160)" filter="url(#boxShadow)">
      <rect x="0" y="0" width="70" height="45" rx="8" fill="#FFFFFF" opacity="0.85" stroke="#CBD5E1" stroke-width="1.5"/>
      <circle cx="15" cy="20" r="4" fill="#EF4444"/><circle cx="35" cy="25" r="4" fill="#3B82F6"/><circle cx="55" cy="18" r="4" fill="#F59E0B"/>
    </g>
    <g transform="translate(115, 135)" filter="url(#boxShadow)">
      <rect x="0" y="0" width="80" height="50" rx="8" fill="#FFFFFF" opacity="0.85" stroke="#CBD5E1" stroke-width="1.5"/>
      <circle cx="20" cy="25" r="5" fill="#10B981"/><circle cx="40" cy="20" r="5" fill="#EC4899"/><circle cx="60" cy="28" r="5" fill="#3B82F6"/>
    </g>
    <g transform="translate(210, 160)" filter="url(#boxShadow)">
      <rect x="0" y="0" width="70" height="45" rx="8" fill="#FFFFFF" opacity="0.85" stroke="#CBD5E1" stroke-width="1.5"/>
      <circle cx="15" cy="20" r="4" fill="#8B5CF6"/><circle cx="35" cy="25" r="4" fill="#EAB308"/><circle cx="55" cy="18" r="4" fill="#EF4444"/>
    </g>
  </g>


  <!-- ================= RIGHT KIT: UNICORN COOKIE ACTIVITY ================= -->
  <g transform="translate(420, 200)" filter="url(#boxShadow)">
    <!-- Standee Backing Card (How To Decorate Unicorn Cookies) -->
    <rect x="0" y="0" width="300" height="240" rx="14" fill="#FDF2F8" stroke="#F472B6" stroke-width="2"/>
    <rect x="10" y="10" width="280" height="50" rx="8" fill="#EC4899"/>
    <text x="150" y="32" font-family="'Comic Sans MS', cursive" font-weight="bold" font-size="12" fill="#FEF08A" text-anchor="middle">HOW TO DECORATE</text>
    <text x="150" y="50" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">UNICORN COOKIES</text>

    <!-- Unicorn Character Badge -->
    <circle cx="250" cy="35" r="22" fill="#FCE7F3"/>
    <polygon points="250,15 245,28 255,28" fill="#F59E0B"/> <!-- Horn -->

    <rect x="15" y="70" width="270" height="155" rx="8" fill="#FFFFFF"/>
    <text x="30" y="95" font-weight="bold" font-size="12" fill="#831843" font-family="sans-serif">1. Warm Up the Icing</text>
    <text x="160" y="95" font-weight="bold" font-size="12" fill="#831843" font-family="sans-serif">2. Apply the Icing</text>
    <text x="30" y="180" font-weight="bold" font-size="12" fill="#831843" font-family="sans-serif">3. Decorate &amp; Enjoy!</text>

    <!-- Main Box Front: Cookies Activity Pink -->
    <g transform="translate(0, 200)">
      <rect width="300" height="200" rx="12" fill="#FFFFFF" stroke="#F472B6" stroke-width="2"/>
      <rect x="15" y="20" width="270" height="160" rx="10" fill="#FCE7F3"/>
      
      <text x="150" y="60" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="24" fill="#9D174D" text-anchor="middle">Cookies Activity</text>

      <!-- Unicorn Illustration -->
      <path d="M 120,130 C 120,110 160,110 160,130 C 170,150 130,165 120,130 Z" fill="#FFFFFF" stroke="#EC4899" stroke-width="1.5"/>
      <polygon points="140,115 136,95 144,95" fill="#F59E0B"/>
      <!-- Rainbow Mane -->
      <circle cx="125" cy="120" r="5" fill="#3B82F6"/>
      <circle cx="132" cy="118" r="5" fill="#EC4899"/>
      <circle cx="140" cy="120" r="5" fill="#F59E0B"/>

      <text x="150" y="175" font-family="sans-serif" font-weight="bold" font-size="10" fill="#9D174D" text-anchor="middle">SPARK JOY EVENT MANAGEMENT</text>
    </g>

    <!-- Clear Sprinkle Tubs -->
    <g transform="translate(20, 160)" filter="url(#boxShadow)">
      <rect x="0" y="0" width="70" height="45" rx="8" fill="#FFFFFF" opacity="0.85" stroke="#CBD5E1" stroke-width="1.5"/>
      <circle cx="15" cy="20" r="4" fill="#EC4899"/><circle cx="35" cy="25" r="4" fill="#3B82F6"/><circle cx="55" cy="18" r="4" fill="#10B981"/>
    </g>
    <g transform="translate(115, 135)" filter="url(#boxShadow)">
      <rect x="0" y="0" width="80" height="50" rx="8" fill="#FFFFFF" opacity="0.85" stroke="#CBD5E1" stroke-width="1.5"/>
      <circle cx="20" cy="25" r="5" fill="#F59E0B"/><circle cx="40" cy="20" r="5" fill="#8B5CF6"/><circle cx="60" cy="28" r="5" fill="#EC4899"/>
    </g>
    <g transform="translate(210, 160)" filter="url(#boxShadow)">
      <rect x="0" y="0" width="70" height="45" rx="8" fill="#FFFFFF" opacity="0.85" stroke="#CBD5E1" stroke-width="1.5"/>
      <circle cx="15" cy="20" r="4" fill="#3B82F6"/><circle cx="35" cy="25" r="4" fill="#F59E0B"/><circle cx="55" cy="18" r="4" fill="#10B981"/>
    </g>
  </g>


  <!-- ================= FOREGROUND COOKIES & HANDS DECORATING ================= -->
  <!-- Left Side: Hand with Red Icing Piping onto Superhero Cookie -->
  <g transform="translate(120, 620)" filter="url(#boxShadow)">
    <!-- Superhero Cookie -->
    <path d="M 50,60 C 20,40 20,90 50,110 C 80,110 110,80 80,40 Z" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
    <path d="M 55,65 C 30,50 30,85 55,100 Z" fill="#EF4444"/> <!-- Red Icing Cape -->
    <path d="M 60,75 L 85,60 L 75,95 Z" fill="#3B82F6"/> <!-- Blue Icing Chest -->

    <!-- Decorating Hand with Red Piping Bag -->
    <g transform="translate(-80, -20) rotate(-25)">
      <path d="M 0,0 L 140,-40 L 155,-20 Z" fill="#DC2626"/>
      <path d="M 0,0 L 140,-40 L 130,-50 Z" fill="#EF4444"/>
      <!-- Stream of Red Icing -->
      <path d="M 0,0 Q -20,20 -40,40" stroke="#EF4444" stroke-width="7" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Right Side: Hand with Pink Icing Piping onto Unicorn Cookie -->
  <g transform="translate(450, 620)" filter="url(#boxShadow)">
    <!-- Unicorn Cookie -->
    <path d="M 40,50 C 40,30 80,20 100,50 C 110,80 70,100 40,80 Z" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
    <!-- White Royal Icing Body -->
    <path d="M 45,52 C 45,35 75,28 95,52 C 102,75 70,92 45,75 Z" fill="#FFFFFF"/>
    <!-- Pink Mane & Horn -->
    <polygon points="80,30 76,15 84,15" fill="#F59E0B"/>
    <circle cx="65" cy="38" r="4" fill="#EC4899"/>

    <!-- Hand with Pink Piping Bag -->
    <g transform="translate(180, 20) rotate(35)">
      <path d="M 0,0 L 140,-40 L 155,-20 Z" fill="#DB2777"/>
      <path d="M 0,0 L 140,-40 L 130,-50 Z" fill="#F472B6"/>
      <path d="M 0,0 Q -20,20 -40,40" stroke="#F472B6" stroke-width="7" stroke-linecap="round" fill="none"/>
    </g>
  </g>


  <!-- ================= BOTTOM ORDER YOUR KIT CARD ================= -->
  <g transform="translate(80, 810)" filter="url(#boxShadow)">
    <rect width="640" height="220" rx="16" fill="#FFFFFF" stroke="#F472B6" stroke-width="2"/>
    
    <!-- Title: ORDER YOUR KIT -->
    <text x="320" y="50" font-family="'Comic Sans MS', cursive" font-weight="900" font-size="28" fill="#BE123C" text-anchor="middle" letter-spacing="1">
      ✨ ORDER YOUR KIT ✨
    </text>

    <!-- Bullet Points -->
    <g font-family="sans-serif" font-size="16" fill="#334155">
      <circle cx="80" cy="88" r="5" fill="#EC4899"/>
      <text x="100" y="93" font-weight="500">Perfect for birthdays, playdates &amp; more!</text>

      <circle cx="80" cy="120" r="5" fill="#EC4899"/>
      <text x="100" y="125" font-weight="500">Fun &amp; creative cookie decorating for kids</text>

      <circle cx="80" cy="152" r="5" fill="#EC4899"/>
      <text x="100" y="157" font-weight="500">Includes everything from yummy cookies to colorful icings!</text>
    </g>

    <!-- WhatsApp Button -->
    <g transform="translate(170, 170)">
      <rect x="0" y="0" width="300" height="40" rx="20" fill="#25D366"/>
      <!-- Phone icon -->
      <circle cx="30" cy="20" r="12" fill="#FFFFFF"/>
      <path d="M 24,16 C 24,16 26,22 28,22 C 29,22 30,20 31,21 C 33,23 35,25 36,27 C 37,28 35,29 35,30 C 35,32 41,34 41,34" stroke="#25D366" stroke-width="2" fill="none"/>
      <text x="165" y="27" font-family="sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">71716286</text>
    </g>
  </g>

  <!-- Hashtags Footer -->
  <text x="400" y="1080" font-family="sans-serif" font-weight="bold" font-size="14" fill="#94A3B8" text-anchor="middle" letter-spacing="1">
    #cookiekits #qatarkids #dohaparties
  </text>

</svg>
