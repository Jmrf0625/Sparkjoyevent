  <text x="500" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="36" fill="#111B3A" text-anchor="middle" letter-spacing="3">UNFORGETTABLE KIDS EVENTS</text>
  <text x="500" y="565" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" fill="#E92D72" text-anchor="middle" letter-spacing="4">IN DOHA & ACROSS QATAR</text>
