<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="mcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCFCE7"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#mcBg)"/>

  <!-- Minecraft Hanging Rope -->
  <line x1="400" y1="0" x2="400" y2="100" stroke="#78350F" stroke-width="8"/>

  <!-- 3D Fringed Minecraft Creeper Piñata Block -->
  <!-- Top Face 3D perspective -->
  <polygon points="300,180 400,120 500,180 400,240" fill="#4ADE80" stroke="#166534" stroke-width="4"/>
  
  <!-- Left Face 3D -->
  <polygon points="300,180 400,240 400,440 300,380" fill="#15803D" stroke="#166534" stroke-width="4"/>

  <!-- Front Face 3D -->
  <polygon points="400,240 500,180 500,380 400,440" fill="#22C55E" stroke="#166534" stroke-width="4"/>

  <!-- Creeper Face Pixel Pattern on Front -->
  <!-- Eyes -->
  <rect x="420" y="270" width="25" height="25" fill="#052E16"/>
  <rect x="460" y="250" width="25" height="25" fill="#052E16"/>

  <!-- Nose & Mouth -->
  <rect x="445" y="295" width="20" height="35" fill="#052E16"/>
  <rect x="430" y="315" width="20" height="40" fill="#052E16"/>
  <rect x="460" y="300" width="20" height="40" fill="#052E16"/>

  <!-- Fringed texture effect -->
  <path d="M 400 350 L 500 290" stroke="#166534" stroke-width="4" stroke-dasharray="6 4"/>
  <path d="M 400 380 L 500 320" stroke="#166534" stroke-width="4" stroke-dasharray="6 4"/>

  <!-- Title Badge -->
  <rect x="150" y="520" width="500" height="50" rx="25" fill="#14532D"/>
  <text x="400" y="552" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">MINECRAFT CREEPER 3D PIÑATA</text>
</svg>
