<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F8" />
      <stop offset="100%" stop-color="#F8C7DC" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad)" />
  
  <!-- Shimmer Backdrop -->
  <g opacity="0.15">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#E92D72" rx="4" />
    </pattern>
    <rect width="800" height="800" fill="url(#grid)" />
  </g>

  <!-- Princess Birthday Castle & Balloon Arch Graphic -->
  <circle cx="400" cy="350" r="220" fill="#FFFFFF" opacity="0.8" />
  
  <!-- Balloons -->
  <ellipse cx="280" cy="280" rx="60" ry="75" fill="#E92D72" />
  <ellipse cx="380" cy="220" rx="70" ry="85" fill="#F8C7DC" />
  <ellipse cx="480" cy="260" rx="65" ry="80" fill="#FFD166" />
  <ellipse cx="540" cy="340" rx="55" ry="70" fill="#8338EC" />

  <!-- Birthday Cake & Castle -->
  <path d="M 320 520 L 480 520 L 460 420 L 340 420 Z" fill="#E92D72" />
  <path d="M 350 420 L 450 420 L 440 340 L 360 340 Z" fill="#F8C7DC" />
  <circle cx="400" cy="310" r="12" fill="#FFD166" />

  <!-- Stars -->
  <path d="M 220 180 L 225 195 L 240 200 L 225 205 L 220 220 L 215 205 L 200 200 L 215 195 Z" fill="#FF9F1C" />
  <path d="M 580 180 L 585 195 L 600 200 L 585 205 L 580 220 L 575 205 L 560 200 L 575 195 Z" fill="#06D6A0" />

  <!-- Label -->
  <rect x="200" y="620" width="400" height="80" rx="40" fill="#111B3A" />
  <text x="400" y="668" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" text-anchor="middle">Princess Birthday Setup</text>
</svg>
