<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="shimmerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Shimmer Backdrop -->
  <rect width="800" height="600" fill="url(#shimmerBg)"/>
  <!-- Shimmer Squares Grid -->
  <g fill="#FFFFFF" opacity="0.4">
    <rect x="50" y="50" width="40" height="40" rx="4"/>
    <rect x="110" y="50" width="40" height="40" rx="4"/>
    <rect x="170" y="50" width="40" height="40" rx="4"/>
    <rect x="610" y="50" width="40" height="40" rx="4"/>
    <rect x="670" y="50" width="40" height="40" rx="4"/>
  </g>

  <!-- Bluey Character 3D Standing Piñata -->
  <g transform="translate(280, 100)">
    <!-- Ears -->
    <polygon points="40,80 70,10 100,80" fill="#2563EB" stroke="#1E40AF" stroke-width="4"/>
    <polygon points="140,80 170,10 200,80" fill="#2563EB" stroke="#1E40AF" stroke-width="4"/>
    <!-- Inner ear -->
    <polygon points="50,75 70,25 90,75" fill="#BFDBFE"/>
    <polygon points="150,75 170,25 190,75" fill="#BFDBFE"/>

    <!-- Main Head & Body (Blocky Fringed Piñata shape) -->
    <rect x="30" y="70" width="180" height="320" rx="40" fill="#60A5FA" stroke="#1E40AF" stroke-width="6"/>

    <!-- Dark Blue Eyebrows & Eye Patches -->
    <rect x="50" y="110" width="60" height="70" rx="15" fill="#1E40AF"/>
    <rect x="130" y="110" width="60" height="70" rx="15" fill="#1E40AF"/>

    <!-- White Eyes -->
    <circle cx="80" cy="145" r="20" fill="#FFFFFF"/>
    <circle cx="160" cy="145" r="20" fill="#FFFFFF"/>
    <circle cx="80" cy="145" r="8" fill="#0F172A"/>
    <circle cx="160" cy="145" r="8" fill="#0F172A"/>

    <!-- Snout & Nose -->
    <rect x="70" y="180" width="100" height="60" rx="25" fill="#FDE047"/>
    <ellipse cx="120" cy="195" rx="20" ry="14" fill="#0F172A"/>

    <!-- Light Blue Belly Patch -->
    <rect x="60" y="250" width="120" height="110" rx="30" fill="#BFDBFE"/>

    <!-- Feet -->
    <rect x="50" y="380" width="45" height="50" rx="12" fill="#2563EB" stroke="#1E40AF" stroke-width="4"/>
    <rect x="145" y="380" width="45" height="50" rx="12" fill="#2563EB" stroke="#1E40AF" stroke-width="4"/>
  </g>

  <!-- Title Badge -->
  <rect x="150" y="520" width="500" height="50" rx="25" fill="#1E40AF"/>
  <text x="400" y="552" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BLUEY 3D STANDING PIÑATA</text>
</svg>
